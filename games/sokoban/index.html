<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推箱子</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #e6f7ff;
    padding: 70px 12px 24px;
  }
  .back-link {
    position: fixed; top: 18px; left: 18px; z-index: 10; color: #a8d8ea;
    text-decoration: none; font-size: 14px; padding: 6px 14px;
    border: 1px solid #2c5364; border-radius: 16px; background: rgba(255,255,255,0.05);
  }
  .wrap { text-align: center; }
  h1 { letter-spacing: 4px; color: #7ce7ff; margin-bottom: 8px; }
  .bar { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    border: none; border-radius: 16px; padding: 7px 12px; cursor: pointer;
    background: #00c9a7; color: #062b26; font-weight: bold;
  }
  button.ghost { background: rgba(255,255,255,0.08); color: #e6f7ff; border: 1px solid #2c5364; }
  .stat { color: #ffd166; font-weight: bold; }
  #board {
    display: inline-grid; background: #102733; padding: 8px; border-radius: 10px;
    user-select: none; touch-action: manipulation;
  }
  .tile { width: var(--cell, 42px); height: var(--cell, 42px); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell, 42px) * 0.62); }
  select {
    background: rgba(255,255,255,0.08); color: #e6f7ff; border: 1px solid #2c5364;
    border-radius: 12px; padding: 6px 8px; font-size: 14px;
  }
  .wall { background: #2c5364; border-radius: 4px; }
  .floor { background: rgba(255,255,255,0.04); border-radius: 4px; }
  .goal { background: rgba(255, 209, 102, 0.18); border-radius: 4px; }
  .pad { margin: 12px auto 0; display: grid; grid-template-columns: 54px 54px 54px; grid-template-rows: 44px 44px; gap: 6px; width: 174px; }
  .pad button { font-size: 18px; }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint { margin-top: 10px; color: #a8d8ea; font-size: 14px; }
  #msg { min-height: 22px; margin-top: 6px; color: #7ce7ff; }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回游戏列表</a>
  <div class="wrap">
    <h1>推箱子</h1>
    <div class="bar">
      <button class="ghost" id="prev" type="button">上一关</button>
      <span class="stat" id="level">第 1 关</span>
      <select id="picker" aria-label="选择关卡"></select>
      <button class="ghost" id="next" type="button">下一关</button>
      <button class="ghost" id="undo" type="button">撤销</button>
      <button id="reset" type="button">重开</button>
      <span class="stat" id="steps">0 步</span>
    </div>
    <div id="board"></div>
    <div class="pad">
      <button class="up" type="button" data-dir="up">↑</button>
      <button class="left" type="button" data-dir="left">←</button>
      <button class="down" type="button" data-dir="down">↓</button>
      <button class="right" type="button" data-dir="right">→</button>
    </div>
    <div id="msg"></div>
    <div class="hint">把全部箱子推到黄格上。方向键或 <b>WASD</b>，<b>U</b> 撤销，<b>R</b> 重开。</div>
  </div>
<script>
(function () {
  const LEVELS = [
    ["#####", "#@$.#", "#####"],
    ["########", "# .  * #", "#      #", "#  #   #", "# $    #", "# @ *  #", "########"],
    ["#########", "# .   $@#", "#   #   #", "#   #   #", "#     * #", "#########"],
    ["#########", "#       #", "#@$   . #", "# ###   #", "#       #", "# *     #", "#########"],
    ["#########", "#   *   #", "# $@    #", "# #  #  #", "#.     *#", "#########"],
    ["########", "# .  * #", "#      #", "#  #   #", "# $    #", "# @$.  #", "########"],
    ["######", "#    #", "# $@.#", "#    #", "######"],
    ["#######", "##   ##", "# . . #", "# $ $ #", "## @ ##", "#######"],
    ["######", "#.   #", "# $$ #", "#  @ #", "# .  #", "######"],
    ["#########", "#   .   #", "#  $$   #", "# # @#  #", "#.     *#", "#########"],
    ["#######", "#     #", "# $ # #", "# #.  #", "#  @  #", "#######"],
    ["########", "# .  * #", "#   @  #", "#  #$  #", "#  $   #", "#   .  #", "########"],
    ["#########", "#   *   #", "#     $@#", "# #  #  #", "#.     *#", "#########"],
    ["########", "# . @* #", "#   $  #", "#  #   #", "#  $   #", "#   .  #", "########"],
    ["########", "# .@$. #", "#   $  #", "#  #   #", "#  $   #", "#   .  #", "########"],
    ["##########", "# .   $  #", "#    #   #", "#  @$   .#", "#  #     #", "#    *   #", "##########"],
    ["  #####", "###   #", "#.@$  #", "### $.#", "  #   #", "  #####"],
    ["########", "# +$ . #", "#   $  #", "#  #   #", "#  $   #", "#   .  #", "########"],
    ["#########", "#   *  @#", "#     $$#", "# #  #  #", "#.     .#", "#########"],
    ["########", "#@*  . #", "#   $  #", "#  #   #", "#  $   #", "#   .  #", "########"],
    ["##########", "# .      #", "#    # $ #", "# @$    .#", "#  #     #", "#    *   #", "##########"],
    ["########", "# .    #", "#   #$ #", "#  $$ .#", "# #@   #", "#    # #", "#  .   #", "########"],
    ["#########", "#   .   #", "#  $    #", "# # $#  #", "#.@$   .#", "#########"],
    ["##########", "#        #", "#@*    . #", "#  # $   #", "#   $ #  #", "#    .   #", "#   #    #", "##########"],
    ["#########", "#   .   #", "#  $    #", "# # $#  #", "#+$    .#", "#########"],
    ["########", "# .$ . #", "#@$    #", "#  #   #", "#  $   #", "#   .  #", "########"],
    ["########", "#  .   #", "#  $   #", "## $#  #", "#   @. #", "########"],
    ["########", "# $  . #", "#  #   #", "# $#   #", "# @  . #", "########"],
    ["########", "#      #", "# .$$. #", "#  @#  #", "#      #", "########"],
    ["#########", "#   .   #", "## $#$# #", "#   @   #", "#  .$.  #", "#########"],
    ["#######", "# $.  #", "# # # #", "#    $#", "#  # @#", "#. $ .#", "#######"],
    ["#######", "# $.  #", "# # # #", "#@$   #", "#  #  #", "#. $ .#", "#######"],
    ["########", "#   .$@#", "# #$   #", "#      #", "#   ## #", "# .    #", "########"],
    ["#######", "#@$.  #", "#$# # #", "# $   #", "#  #  #", "#.   .#", "#######"],
    ["#######", "# $.  #", "# # # #", "#     #", "# $#  #", "#.  $+#", "#######"],
    ["#######", "# $.  #", "# # # #", "#     #", "# $#$ #", "#.@  .#", "#######"]
  ];
  const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1], w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1] };
  let index, walls, blocked, goals, boxes, pr, pc, steps, undoStack, won, H, W;

  function load(i) {
    index = (i + LEVELS.length) % LEVELS.length;
    const rows = LEVELS[index];
    H = rows.length; W = Math.max(...rows.map(r => r.length));
    walls = new Set(); blocked = new Set(); goals = new Set(); boxes = new Set();
    for (let r = 0; r < H; r++) {
      const line = rows[r].padEnd(W, ' ');
      for (let c = 0; c < W; c++) {
        const ch = line[c], k = r + ',' + c;
        if (ch === '#') walls.add(k);
        if (ch === '.' || ch === '*' || ch === '+') goals.add(k);
        if (ch === '$' || ch === '*') boxes.add(k);
        if (ch === '@' || ch === '+') { pr = r; pc = c; }
      }
    }
    const ext = new Set();
    const q = [];
    const see = (r, c) => {
      const k = r + ',' + c;
      if (r < 0 || c < 0 || r >= H || c >= W || walls.has(k) || ext.has(k) || goals.has(k) || boxes.has(k)) return;
      ext.add(k); q.push([r, c]);
    };
    for (let r = 0; r < H; r++) { see(r, 0); see(r, W - 1); }
    for (let c = 0; c < W; c++) { see(0, c); see(H - 1, c); }
    while (q.length) { const [r, c] = q.pop(); see(r + 1, c); see(r - 1, c); see(r, c + 1); see(r, c - 1); }
    ext.forEach(k => { if (k !== pr + ',' + pc) blocked.add(k); });
    steps = 0; undoStack = []; won = false;
    localStorage.setItem('gc_sokoban_level', index);
    document.getElementById('level').textContent = '第 ' + (index + 1) + ' / ' + LEVELS.length + ' 关';
    document.getElementById('picker').value = String(index);
    document.getElementById('msg').textContent = '';
    render();
  }
  function snapshot() {
    undoStack.push({ pr, pc, boxes: [...boxes].join('|'), steps });
    if (undoStack.length > 400) undoStack.shift();
  }
  function render() {
    const board = document.getElementById('board');
    const cell = Math.max(28, Math.min(42, Math.floor((Math.min(window.innerWidth, 760) - 48) / W)));
    board.style.setProperty('--cell', cell + 'px');
    board.style.gridTemplateColumns = 'repeat(' + W + ', ' + cell + 'px)';
    board.innerHTML = '';
    let done = 0;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
      const k = r + ',' + c;
      const el = document.createElement('div');
      el.className = 'tile';
      if (walls.has(k)) el.classList.add('wall');
      else if (!blocked.has(k)) { el.classList.add('floor'); paint(el, k, r, c); }
      if (boxes.has(k) && goals.has(k)) done++;
      board.appendChild(el);
    }
    document.getElementById('steps').textContent = steps + ' 步';
    if (!won && goals.size && done === goals.size) {
      won = true;
      document.getElementById('msg').textContent = index === LEVELS.length - 1 ? '全部通关。' : '过关了，可以进入下一关。';
    }
  }
  function paint(el, k, r, c) {
    if (goals.has(k)) el.classList.add('goal');
    if (r === pr && c === pc) el.textContent = '🙂';
    else if (boxes.has(k)) el.textContent = goals.has(k) ? '🎁' : '📦';
    else if (goals.has(k)) el.textContent = '·';
  }
  function move(dir) {
    if (won || !dir) return;
    const [dr, dc] = dir;
    const nr = pr + dr, nc = pc + dc, nk = nr + ',' + nc;
    const solid = (r, c) => r < 0 || c < 0 || r >= H || c >= W || walls.has(r + ',' + c) || blocked.has(r + ',' + c);
    if (solid(nr, nc)) return;
    snapshot();
    if (boxes.has(nk)) {
      const br = nr + dr, bc = nc + dc, bk = br + ',' + bc;
      if (solid(br, bc) || boxes.has(bk)) { undoStack.pop(); return; }
      boxes.delete(nk); boxes.add(bk);
    }
    pr = nr; pc = nc; steps++;
    render();
  }
  function undo() {
    const prev = undoStack.pop();
    if (!prev) return;
    pr = prev.pr; pc = prev.pc; steps = prev.steps;
    boxes = new Set(prev.boxes ? prev.boxes.split('|') : []);
    won = false;
    document.getElementById('msg').textContent = '';
    render();
  }
  const picker = document.getElementById('picker');
  LEVELS.forEach((_, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = '第 ' + (i + 1) + ' 关';
    picker.appendChild(opt);
  });
  picker.onchange = () => load(Number(picker.value));
  document.getElementById('prev').onclick = () => load(index - 1);
  document.getElementById('next').onclick = () => load(index + 1);
  document.getElementById('undo').onclick = undo;
  document.getElementById('reset').onclick = () => load(index);
  document.querySelector('.pad').onclick = (e) => {
    const d = e.target.dataset.dir;
    if (d) move(DIRS[d]);
  };
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (DIRS[k] || DIRS[e.key]) { e.preventDefault(); move(DIRS[k] || DIRS[e.key]); }
    else if (k === 'u' || k === 'z') undo();
    else if (k === 'r') load(index);
    else if (k === 'n' && won) load(index + 1);
  });
  load(Number(localStorage.getItem('gc_sokoban_level') || 0));
})();
</script>
</body>
</html>
