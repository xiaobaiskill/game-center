<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6f7ff;
    padding: 24px 12px;
  }
  .back-link {
    position: fixed; top: 18px; left: 18px; z-index: 10;
    color: #a8d8ea; text-decoration: none; font-size: 14px;
    padding: 6px 14px; border: 1px solid #2c5364; border-radius: 16px;
    background: rgba(255,255,255,0.05);
  }
  .back-link:hover { background: rgba(255,255,255,0.12); }
  .game-wrap { text-align: center; width: min(92vw, 440px); }
  h1 { font-size: 28px; letter-spacing: 4px; color: #7ce7ff; margin-bottom: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #1b3a4b; border-radius: 8px; min-width: 78px; padding: 6px 10px;
  }
  .score-box small { display: block; color: #a8d8ea; font-size: 12px; letter-spacing: 1px; }
  .score-box b { font-size: 20px; color: #ffd166; }
  button {
    border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer;
    background: #00c9a7; color: #062b26; font-weight: bold; letter-spacing: 1px;
  }
  button:hover { background: #2ee6c4; }
  #board {
    width: 100%; aspect-ratio: 1;
    --pad: 12px; --gap: 10px; --cell: 80px;
    background: #bbada0; border-radius: 8px;
    position: relative; touch-action: none; user-select: none;
  }
  .slot, .tile {
    position: absolute;
    width: var(--cell); height: var(--cell);
    border-radius: 6px;
  }
  .slot { background: rgba(238, 228, 218, 0.35); }
  .tile {
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #f9f6f2;
    font-size: calc(var(--cell) * 0.46);
    line-height: 1;
    transition: top 120ms ease-in, left 120ms ease-in;
    z-index: 2;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
  }
  .tile.d3 { font-size: calc(var(--cell) * 0.38); }
  .tile.d4 { font-size: calc(var(--cell) * 0.30); }
  .tile.d5 { font-size: calc(var(--cell) * 0.24); }
  .tile.t2, .tile.t4 { color: #776e65; }
  .tile.t2 { background: #eee4da; }
  .tile.t4 { background: #ede0c8; }
  .tile.t8 { background: #f2b179; }
  .tile.t16 { background: #f59563; }
  .tile.t32 { background: #f67c5f; }
  .tile.t64 { background: #f65e3b; }
  .tile.t128 { background: #edcf72; }
  .tile.t256 { background: #edcc61; }
  .tile.t512 { background: #edc850; }
  .tile.t1024 { background: #edc53f; }
  .tile.t2048 { background: #edc22e; }
  .tile.tbig { background: #3c3a32; }
  .tile.merge { animation: mergepop 140ms ease-out; z-index: 3; }
  .tile.spawn { animation: popin 140ms ease-out; }
  @keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes mergepop {
    0% { transform: scale(0.55); }
    55% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 8px; z-index: 5;
    background: rgba(238, 228, 218, 0.72);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #776e65;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 28px; letter-spacing: 2px; }
  .overlay button + button { background: #8f7a66; color: #f9f6f2; }
  .controls { margin-top: 14px; color: #a8d8ea; font-size: 14px; line-height: 1.7; }
  kbd { background: #2c5364; border: 1px solid #4a7a8f; border-radius: 4px; padding: 1px 6px; }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回游戏列表</a>
  <div class="game-wrap">
    <h1>2048</h1>
    <div class="top">
      <div class="scores">
        <div class="score-box"><small>得分</small><b id="score">0</b></div>
        <div class="score-box"><small>最高</small><b id="best">0</b></div>
      </div>
      <button id="newBtn" type="button">新游戏</button>
    </div>
    <div id="board">
      <div class="slots"></div>
      <div class="tiles"></div>
      <div class="overlay hidden" id="mask"></div>
    </div>
    <div class="controls">方向键 / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或滑动。相同数字会滑到一起再合并。</div>
  </div>
<script>
(function () {
  const boardEl = document.getElementById('board');
  const tilesEl = boardEl.querySelector('.tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const mask = document.getElementById('mask');
  let tiles = [];
  let nextId = 1;
  let score, best, won, over, announced, busy, epoch;

  best = Number(localStorage.getItem('gc2048_best') || 0);
  bestEl.textContent = best;

  function layout() {
    const pad = 12, gap = 10;
    const size = boardEl.clientWidth || 360;
    const cell = (size - pad * 2 - gap * 3) / 4;
    boardEl.style.setProperty('--pad', pad + 'px');
    boardEl.style.setProperty('--gap', gap + 'px');
    boardEl.style.setProperty('--cell', cell + 'px');
  }

  function place(el, r, c) {
    el.style.left = 'calc(var(--pad) + ' + c + ' * (var(--cell) + var(--gap)))';
    el.style.top = 'calc(var(--pad) + ' + r + ' * (var(--cell) + var(--gap)))';
  }

  function paint(el, tile, extra) {
    const digits = String(tile.v).length;
    el.className = 'tile t' + (tile.v > 2048 ? 'big' : tile.v) + (digits >= 3 ? ' d' + Math.min(digits, 5) : '') + (extra ? ' ' + extra : '');
    el.textContent = tile.v;
    place(el, tile.r, tile.c);
  }

  function addEl(tile, extra) {
    const el = document.createElement('div');
    el.dataset.id = tile.id;
    paint(el, tile, extra);
    tilesEl.appendChild(el);
    return el;
  }

  function buildSlots() {
    const slots = boardEl.querySelector('.slots');
    slots.innerHTML = '';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const s = document.createElement('div');
      s.className = 'slot';
      place(s, r, c);
      slots.appendChild(s);
    }
  }

  function spawn(extra) {
    const used = new Set(tiles.map(t => t.r + ',' + t.c));
    const empty = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!used.has(r + ',' + c)) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const tile = { id: nextId++, r, c, v: Math.random() < 0.9 ? 2 : 4 };
    tiles.push(tile);
    addEl(tile, extra);
  }

  function canMove() {
    if (tiles.length < 16) return true;
    const at = {};
    tiles.forEach(t => { at[t.r + ',' + t.c] = t.v; });
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const v = at[r + ',' + c];
      if (c < 3 && v === at[r + ',' + (c + 1)]) return true;
      if (r < 3 && v === at[(r + 1) + ',' + c]) return true;
    }
    return false;
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('gc2048_best', best);
    }
  }

  function showOverlay() {
    if (over) {
      mask.classList.remove('hidden');
      mask.innerHTML = '<h2>无法再移动</h2><button type="button" id="again">再来一局</button>';
      document.getElementById('again').onclick = start;
    } else if (won) {
      mask.classList.remove('hidden');
      mask.innerHTML = '<h2>到达 2048</h2><button type="button" id="keep">继续挑战</button><button type="button" id="again">新游戏</button>';
      document.getElementById('again').onclick = start;
      document.getElementById('keep').onclick = () => { won = false; mask.classList.add('hidden'); };
    } else mask.classList.add('hidden');
  }

  function lineOf(dir, index) {
    const list = [];
    const across = dir === 'left' || dir === 'right';
    const reverse = dir === 'right' || dir === 'down';
    for (let i = 0; i < 4; i++) {
      const n = reverse ? 3 - i : i;
      const r = across ? index : n;
      const c = across ? n : index;
      const tile = tiles.find(t => t.r === r && t.c === c);
      if (tile) list.push(tile);
    }
    return list;
  }

  function destOf(dir, index, pos) {
    if (dir === 'left') return { r: index, c: pos };
    if (dir === 'right') return { r: index, c: 3 - pos };
    if (dir === 'up') return { r: pos, c: index };
    return { r: 3 - pos, c: index };
  }

  function move(dir) {
    if (busy || over || won) return;
    const motions = [];
    let gained = 0;
    let changed = false;
    for (let i = 0; i < 4; i++) {
      const line = lineOf(dir, i);
      let pos = 0;
      for (let k = 0; k < line.length; k++) {
        const tile = line[k];
        const dest = destOf(dir, i, pos);
        if (k + 1 < line.length && tile.v === line[k + 1].v) {
          const other = line[++k];
          gained += tile.v * 2;
          changed = true;
          motions.push({ tile, toR: dest.r, toC: dest.c, become: tile.v * 2 });
          motions.push({ tile: other, toR: dest.r, toC: dest.c, remove: true });
        } else {
          if (tile.r !== dest.r || tile.c !== dest.c) changed = true;
          motions.push({ tile, toR: dest.r, toC: dest.c });
        }
        pos++;
      }
    }
    if (!changed) return;
    busy = true;
    const token = epoch;
    score += gained;
    updateScore();
    motions.forEach(m => {
      const el = tilesEl.querySelector('[data-id="' + m.tile.id + '"]');
      if (!el) return;
      place(el, m.toR, m.toC);
    });
    setTimeout(() => {
      if (token !== epoch) return;
      motions.forEach(m => {
        const el = tilesEl.querySelector('[data-id="' + m.tile.id + '"]');
        if (m.remove) {
          tiles = tiles.filter(t => t.id !== m.tile.id);
          if (el) el.remove();
          return;
        }
        m.tile.r = m.toR;
        m.tile.c = m.toC;
        if (m.become) {
          m.tile.v = m.become;
          if (el) paint(el, m.tile, 'merge');
        }
      });
      spawn('spawn');
      if (!canMove()) over = true;
      else if (!announced && tiles.some(t => t.v >= 2048)) { won = true; announced = true; }
      showOverlay();
      busy = false;
    }, 130);
  }

  function start() {
    epoch = (epoch || 0) + 1;
    busy = false;
    tiles = [];
    tilesEl.innerHTML = '';
    score = 0; won = false; over = false; announced = false;
    updateScore();
    mask.classList.add('hidden');
    layout();
    spawn();
    spawn();
  }

  layout();
  buildSlots();
  document.getElementById('newBtn').onclick = start;
  window.addEventListener('resize', layout);
  document.addEventListener('keydown', (e) => {
    const map = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' };
    const dir = map[e.key.toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  let sx = 0, sy = 0;
  boardEl.addEventListener('touchstart', (e) => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  boardEl.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.hypot(dx, dy) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  start();
})();
</script>
</body>
</html>
