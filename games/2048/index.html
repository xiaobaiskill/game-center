<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6f7ff;
    padding: 24px 12px;
  }
  .back-link {
    position: fixed; top: 18px; left: 18px; z-index: 10;
    color: #a8d8ea; text-decoration: none; font-size: 14px;
    padding: 6px 14px; border: 1px solid #2c5364; border-radius: 16px;
    background: rgba(255,255,255,0.05);
  }
  .back-link:hover { background: rgba(255,255,255,0.12); }
  .game-wrap { text-align: center; width: min(92vw, 440px); }
  h1 { font-size: 28px; letter-spacing: 4px; color: #7ce7ff; margin-bottom: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #1b3a4b; border-radius: 8px; min-width: 78px; padding: 6px 10px;
  }
  .score-box small { display: block; color: #a8d8ea; font-size: 12px; letter-spacing: 1px; }
  .score-box b { font-size: 20px; color: #ffd166; }
  button {
    border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer;
    background: #00c9a7; color: #062b26; font-weight: bold; letter-spacing: 1px;
  }
  button:hover { background: #2ee6c4; }
  #board {
    width: 100%; aspect-ratio: 1; display: grid;
    grid-template-columns: repeat(4, 1fr); gap: 10px;
    background: #163244; padding: 10px; border-radius: 12px;
    touch-action: none; position: relative; user-select: none;
  }
  .cell {
    border-radius: 8px; background: rgba(238, 228, 218, 0.08);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 34px;
  }
  .cell.s2 { background: #eee4da; color: #776e65; }
  .cell.s4 { background: #ede0c8; color: #776e65; }
  .cell.s8 { background: #f2b179; color: #f9f6f2; }
  .cell.s16 { background: #f59563; color: #f9f6f2; }
  .cell.s32 { background: #f67c5f; color: #f9f6f2; }
  .cell.s64 { background: #f65e3b; color: #f9f6f2; }
  .cell.s128 { background: #edcf72; color: #f9f6f2; font-size: 30px; }
  .cell.s256 { background: #edcc61; color: #f9f6f2; font-size: 30px; }
  .cell.s512 { background: #edc850; color: #f9f6f2; font-size: 30px; }
  .cell.s1024 { background: #edc53f; color: #f9f6f2; font-size: 24px; }
  .cell.s2048 { background: #edc22e; color: #f9f6f2; font-size: 24px; }
  .cell.sbig { background: #3c3a32; color: #f9f6f2; font-size: 22px; }
  .overlay {
    position: absolute; inset: 0; border-radius: 12px;
    background: rgba(10, 22, 34, 0.78);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 28px; letter-spacing: 2px; }
  .controls { margin-top: 14px; color: #a8d8ea; font-size: 14px; line-height: 1.7; }
  kbd { background: #2c5364; border: 1px solid #4a7a8f; border-radius: 4px; padding: 1px 6px; }
  @media (max-width: 420px) { .cell { font-size: 26px; } .cell.s128, .cell.s256, .cell.s512 { font-size: 22px; } }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回游戏列表</a>
  <div class="game-wrap">
    <h1>2048</h1>
    <div class="top">
      <div class="scores">
        <div class="score-box"><small>得分</small><b id="score">0</b></div>
        <div class="score-box"><small>最高</small><b id="best">0</b></div>
      </div>
      <button id="newBtn" type="button">新游戏</button>
    </div>
    <div id="board"></div>
    <div class="controls">方向键 / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或滑动。相同数字撞在一起会合并。</div>
  </div>
<script>
(function () {
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  let grid, score, best, won, over, announced;

  best = Number(localStorage.getItem('gc2048_best') || 0);
  bestEl.textContent = best;

  function slide(line) {
    const arr = line.filter(Boolean);
    const out = [];
    let gained = 0;
    for (let i = 0; i < arr.length; i++) {
      if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
        const v = arr[i] * 2;
        out.push(v);
        gained += v;
        i++;
      } else out.push(arr[i]);
    }
    while (out.length < 4) out.push(0);
    return { line: out, gained };
  }

  function emptyCells() {
    const list = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) list.push([r, c]);
    return list;
  }

  function addTile() {
    const list = emptyCells();
    if (!list.length) return;
    const [r, c] = list[Math.floor(Math.random() * list.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
      if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
    }
    return false;
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const v = grid[r][c];
      const el = document.createElement('div');
      el.className = 'cell' + (v ? (v > 2048 ? ' sbig' : ' s' + v) : '');
      el.textContent = v || '';
      boardEl.appendChild(el);
    }
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('gc2048_best', best);
    }
    if (over || (won && !boardEl.querySelector('.overlay'))) {
      const mask = document.createElement('div');
      mask.className = 'overlay';
      mask.innerHTML = over
        ? '<h2>无法再移动</h2><button type="button" id="again">再来一局</button>'
        : '<h2>到达 2048</h2><button type="button" id="keep">继续挑战</button><button type="button" id="again">新游戏</button>';
      boardEl.appendChild(mask);
      const again = document.getElementById('again');
      if (again) again.onclick = start;
      const keep = document.getElementById('keep');
      if (keep) keep.onclick = () => { won = false; mask.remove(); };
    }
  }

  function move(dir) {
    if (over || won) return;
    const next = grid.map(row => row.slice());
    let gained = 0;
    let changed = false;
    const applyLine = (line, reverse) => {
      const src = reverse ? line.slice().reverse() : line.slice();
      const res = slide(src);
      const out = reverse ? res.line.slice().reverse() : res.line;
      gained += res.gained;
      return out;
    };
    if (dir === 'left' || dir === 'right') {
      for (let r = 0; r < 4; r++) {
        const out = applyLine(next[r], dir === 'right');
        if (out.some((v, i) => v !== next[r][i])) changed = true;
        next[r] = out;
      }
    } else {
      for (let c = 0; c < 4; c++) {
        const line = [0, 1, 2, 3].map(r => next[r][c]);
        const out = applyLine(line, dir === 'down');
        for (let r = 0; r < 4; r++) {
          if (next[r][c] !== out[r]) changed = true;
          next[r][c] = out[r];
        }
      }
    }
    if (!changed) return;
    grid = next;
    score += gained;
    addTile();
    if (!canMove()) over = true;
    else if (!announced && grid.some(row => row.some(v => v >= 2048))) { won = true; announced = true; }
    render();
  }

  function start() {
    grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    score = 0; won = false; over = false; announced = false;
    addTile(); addTile();
    render();
  }

  document.getElementById('newBtn').onclick = start;
  document.addEventListener('keydown', (e) => {
    const map = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' };
    const dir = map[e.key.toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  let sx = 0, sy = 0;
  boardEl.addEventListener('touchstart', (e) => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  boardEl.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.hypot(dx, dy) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  start();
})();
</script>
</body>
</html>
