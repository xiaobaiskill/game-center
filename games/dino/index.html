<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小恐龙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #e6f7ff;
    padding: 70px 12px 24px;
  }
  .back-link {
    position: fixed; top: 18px; left: 18px; z-index: 10; color: #a8d8ea;
    text-decoration: none; font-size: 14px; padding: 6px 14px;
    border: 1px solid #2c5364; border-radius: 16px; background: rgba(255,255,255,0.05);
  }
  .wrap { text-align: center; width: min(96vw, 920px); }
  h1 { letter-spacing: 4px; color: #7ce7ff; margin-bottom: 12px; }
  canvas {
    width: 100%; height: auto; background: #f7f7f7; border-radius: 10px;
    display: block; touch-action: manipulation; cursor: pointer;
  }
  .row { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
  button {
    border: none; border-radius: 18px; padding: 8px 18px; cursor: pointer;
    background: #00c9a7; color: #062b26; font-weight: bold;
  }
  .hint { margin-top: 10px; color: #a8d8ea; font-size: 14px; line-height: 1.7; }
  kbd { background: #2c5364; border: 1px solid #4a7a8f; border-radius: 4px; padding: 1px 6px; }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回游戏列表</a>
  <div class="wrap">
    <h1>小恐龙</h1>
    <canvas id="game" width="900" height="280"></canvas>
    <div class="row">
      <button type="button" id="jump">跳</button>
      <button type="button" id="duck">蹲</button>
    </div>
    <div class="hint"><kbd>空格</kbd> / <kbd>↑</kbd> 跳，<kbd>↓</kbd> 蹲。躲开仙人掌，低飞的鸟要蹲，高飞的鸟从下面过去。</div>
  </div>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 900, H = 280, GROUND = 214;
  let y = 0, vy = 0, duck = false, speed = 7, score = 0, best = Number(localStorage.getItem('gc_dino_best') || 0);
  let obstacles = [], clouds = [], gap = 0, running = false, dead = false, frame = 0, leg = 0;
  let last = 0;

  function reset(run) {
    y = 0; vy = 0; duck = false; speed = 7; score = 0;
    obstacles = []; clouds = [{ x: 180, y: 60 }, { x: 520, y: 40 }, { x: 760, y: 78 }];
    gap = 0; running = !!run; dead = false; frame = 0;
  }

  function dinoBox() {
    const h = duck && y === 0 ? 28 : 48;
    const w = duck && y === 0 ? 62 : 42;
    return { x: 58, y: GROUND - y - h, w, h };
  }

  function spawn() {
    if (score > 180 && Math.random() < 0.28) {
      const high = Math.random() < 0.5;
      obstacles.push({ type: 'bird', x: W + 10, w: 46, h: 22, y: high ? GROUND - 92 : GROUND - 48, flap: 0 });
    } else {
      const h = 34 + Math.floor(Math.random() * 28);
      const w = 14 + Math.floor(Math.random() * 3) * 10;
      obstacles.push({ type: 'cactus', x: W + 10, w, h, y: GROUND - h });
    }
  }

  function hit(a, b) {
    const p = 6;
    return a.x + p < b.x + b.w && a.x + a.w - p > b.x && a.y + p < b.y + b.h && a.y + a.h - p > b.y + 2;
  }

  function jump() {
    if (dead) { reset(true); return; }
    if (!running) { reset(true); }
    if (y === 0) vy = 13.2;
  }
  function setDuck(v) { duck = v; if (v && y > 0) vy = Math.min(vy, -4); }

  function update(dt) {
    frame++;
    if (!running) return;
    const grav = duck && y > 0 ? 1.15 : 0.62;
    vy -= grav * dt;
    y += vy * dt;
    if (y <= 0) { y = 0; vy = 0; }
    speed = Math.min(15, 7 + score / 180);
    score += speed * 0.08 * dt;
    if (y === 0 && !duck) leg += dt;
    gap -= speed * dt;
    if (gap <= 0) {
      spawn();
      gap = 320 + Math.random() * 260;
    }
    obstacles.forEach(o => {
      o.x -= speed * dt;
      if (o.type === 'bird') o.flap += dt;
    });
    clouds.forEach(c => { c.x -= speed * 0.25 * dt; if (c.x < -80) c.x = W + 40; });
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    const box = dinoBox();
    if (obstacles.some(o => hit(box, o))) {
      dead = true; running = false;
      if (Math.floor(score) > best) {
        best = Math.floor(score);
        localStorage.setItem('gc_dino_best', best);
      }
    }
  }

  function drawDino(box) {
    const night = Math.floor(score / 500) % 2 === 1 && running;
    ctx.fillStyle = night ? '#f4f4f4' : '#535353';
    const { x, y: top, w, h } = box;
    ctx.fillRect(x + 8, top + 16, w - 16, h - 18);
    if (!(duck && y === 0)) {
      ctx.fillRect(x + w - 22, top, 20, 18);
      ctx.fillRect(x + w - 8, top + 4, 8, 6);
      ctx.fillStyle = night ? '#222' : '#f7f7f7';
      ctx.fillRect(x + w - 12, top + 5, 3, 3);
      ctx.fillStyle = night ? '#f4f4f4' : '#535353';
      ctx.fillRect(x - 10, top + 20, 18, 8);
    } else {
      ctx.fillRect(x + w - 16, top + 4, 16, 12);
    }
    const step = Math.floor(leg / 4) % 2;
    if (y > 0) {
      ctx.fillRect(x + 12, top + h - 8, 6, 10);
      ctx.fillRect(x + 24, top + h - 4, 6, 6);
    } else if (step) {
      ctx.fillRect(x + 12, top + h - 2, 7, 8);
      ctx.fillRect(x + 26, top + h - 6, 7, 6);
    } else {
      ctx.fillRect(x + 12, top + h - 6, 7, 6);
      ctx.fillRect(x + 26, top + h - 2, 7, 8);
    }
  }

  function draw() {
    const night = (running || dead) && Math.floor(score / 500) % 2 === 1;
    ctx.fillStyle = night ? '#202124' : '#f7f7f7';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = night ? '#9aa0a6' : '#d0d0d0';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 28, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 22, c.y + 4, 18, 10, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.strokeStyle = night ? '#9aa0a6' : '#535353';
    ctx.beginPath();
    ctx.moveTo(0, GROUND + 1);
    ctx.lineTo(W, GROUND + 1);
    ctx.stroke();
    const offset = Math.floor(score * 8) % 28;
    ctx.fillStyle = night ? '#9aa0a6' : '#535353';
    for (let x = -offset; x < W; x += 28) ctx.fillRect(x, GROUND + 6, 12, 2);

    obstacles.forEach(o => {
      ctx.fillStyle = night ? '#f4f4f4' : '#535353';
      if (o.type === 'cactus') {
        ctx.fillRect(o.x + o.w / 2 - 4, o.y, 8, o.h);
        if (o.w > 16) ctx.fillRect(o.x, o.y + 10, 8, 22);
        if (o.w > 26) ctx.fillRect(o.x + o.w - 8, o.y + 16, 8, 18);
      } else {
        const wing = Math.floor(o.flap / 8) % 2 ? -8 : 8;
        ctx.fillRect(o.x, o.y + 8, o.w, 8);
        ctx.fillRect(o.x + 8, o.y + wing, 16, 8);
      }
    });
    drawDino(dinoBox());

    ctx.fillStyle = night ? '#f4f4f4' : '#535353';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(Math.floor(score)).padStart(5, '0'), W - 16, 32);
    ctx.font = '14px sans-serif';
    ctx.fillText('HI ' + String(best).padStart(5, '0'), W - 120, 32);
    ctx.textAlign = 'center';
    ctx.font = '22px sans-serif';
    if (!running && !dead) ctx.fillText('按空格开始', W / 2, 78);
    if (dead) {
      ctx.fillText('撞到了', W / 2, 78);
      ctx.font = '16px sans-serif';
      ctx.fillText('按空格再跑一次', W / 2, 106);
    }
  }

  function frameLoop(t) {
    const dt = Math.min(2.2, (t - last) / 16.67 || 1);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frameLoop);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
    if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); setDuck(true); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowDown' || e.key === 's') setDuck(false);
  });
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const yPos = (e.clientY - rect.top) / rect.height;
    if (yPos > 0.62) setDuck(true); else jump();
  });
  canvas.addEventListener('pointerup', () => setDuck(false));
  document.getElementById('jump').onclick = jump;
  const duckBtn = document.getElementById('duck');
  duckBtn.onpointerdown = () => setDuck(true);
  duckBtn.onpointerup = duckBtn.onpointerleave = () => setDuck(false);

  reset(false);
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
