<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小恐龙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(#8fd3ff, #e7f6d8);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #1d4a32;
    padding: 70px 12px 24px;
  }
  .back-link {
    position: fixed; top: 18px; left: 18px; z-index: 10; color: #1d4a32;
    text-decoration: none; font-size: 14px; padding: 6px 14px;
    border: 1px solid #7dba8a; border-radius: 16px; background: rgba(255,255,255,0.7);
  }
  .wrap { text-align: center; width: min(96vw, 920px); }
  h1 { letter-spacing: 4px; color: #1f7a3a; margin-bottom: 12px; }
  canvas {
    width: 100%; height: auto; border-radius: 16px;
    display: block; touch-action: manipulation; cursor: pointer;
    box-shadow: 0 10px 28px rgba(40, 90, 50, 0.18);
  }
  .row { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
  button {
    border: none; border-radius: 18px; padding: 8px 18px; cursor: pointer;
    background: #3cba4e; color: #fff; font-weight: bold;
  }
  button#duck { background: #e08a3c; }
  .hint { margin-top: 10px; color: #2d6a45; font-size: 14px; line-height: 1.7; }
  kbd { background: #fff; border: 1px solid #9dcea8; border-radius: 4px; padding: 1px 6px; }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回游戏列表</a>
  <div class="wrap">
    <h1>小恐龙</h1>
    <canvas id="game" width="900" height="280"></canvas>
    <div class="row">
      <button type="button" id="jump">跳</button>
      <button type="button" id="duck">蹲</button>
    </div>
    <div class="hint"><kbd>空格</kbd> / <kbd>↑</kbd> 跳，<kbd>↓</kbd> 蹲。躲开仙人掌，低飞的鸟要蹲，高飞的鸟从下面过去。</div>
  </div>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 900, H = 280, GROUND = 214;
  let y = 0, vy = 0, duck = false, speed = 7, score = 0, best = Number(localStorage.getItem('gc_dino_best') || 0);
  let obstacles = [], clouds = [], gap = 0, running = false, dead = false, frame = 0, leg = 0;
  let last = 0;

  function reset(run) {
    y = 0; vy = 0; duck = false; speed = 7; score = 0;
    obstacles = []; clouds = [{ x: 180, y: 54 }, { x: 520, y: 36 }, { x: 760, y: 70 }];
    gap = 0; running = !!run; dead = false; frame = 0;
  }

  function dinoBox() {
    const h = duck && y === 0 ? 28 : 48;
    const w = duck && y === 0 ? 62 : 42;
    return { x: 58, y: GROUND - y - h, w, h };
  }

  function spawn() {
    if (score > 180 && Math.random() < 0.28) {
      const high = Math.random() < 0.5;
      obstacles.push({ type: 'bird', x: W + 10, w: 46, h: 22, y: high ? GROUND - 92 : GROUND - 48, flap: 0 });
    } else {
      const h = 34 + Math.floor(Math.random() * 28);
      const w = 14 + Math.floor(Math.random() * 3) * 10;
      obstacles.push({ type: 'cactus', x: W + 10, w, h, y: GROUND - h });
    }
  }

  function hit(a, b) {
    const p = 6;
    return a.x + p < b.x + b.w && a.x + a.w - p > b.x && a.y + p < b.y + b.h && a.y + a.h - p > b.y + 2;
  }

  function jump() {
    if (dead) { reset(true); return; }
    if (!running) { reset(true); }
    if (y === 0) vy = 13.2;
  }
  function setDuck(v) { duck = v; if (v && y > 0) vy = Math.min(vy, -4); }

  function update(dt) {
    frame++;
    if (!running) return;
    const grav = duck && y > 0 ? 1.15 : 0.62;
    vy -= grav * dt;
    y += vy * dt;
    if (y <= 0) { y = 0; vy = 0; }
    speed = Math.min(15, 7 + score / 180);
    score += speed * 0.08 * dt;
    if (y === 0 && !duck) leg += dt;
    gap -= speed * dt;
    if (gap <= 0) {
      spawn();
      gap = 320 + Math.random() * 260;
    }
    obstacles.forEach(o => {
      o.x -= speed * dt;
      if (o.type === 'bird') o.flap += dt;
    });
    clouds.forEach(c => { c.x -= speed * 0.25 * dt; if (c.x < -80) c.x = W + 40; });
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    const box = dinoBox();
    if (obstacles.some(o => hit(box, o))) {
      dead = true; running = false;
      if (Math.floor(score) > best) {
        best = Math.floor(score);
        localStorage.setItem('gc_dino_best', best);
      }
    }
  }

  function night() { return (running || dead) && Math.floor(score / 500) % 2 === 1; }

  function round(x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
    ctx.fill();
  }

  function drawDino(box) {
    const { x, y: top, w, h } = box;
    const dark = night();
    const body = dark ? '#8dff9a' : '#3cba4e';
    const belly = dark ? '#f3ffe8' : '#e7f8c8';
    const ink = '#1d5c30';
    const low = duck && y === 0;
    ctx.fillStyle = body;
    if (!low) {
      ctx.beginPath();
      ctx.moveTo(x + 10, top + h * 0.52);
      ctx.quadraticCurveTo(x - 18, top + h * 0.62, x - 8, top + h * 0.78);
      ctx.quadraticCurveTo(x + 6, top + h * 0.7, x + 14, top + h * 0.8);
      ctx.fill();
      round(x + 4, top + 18, w - 6, h - 24, 12);
      ctx.fillStyle = belly;
      round(x + 10, top + 26, w * 0.42, h - 38, 8);
      ctx.fillStyle = body;
      round(x + w - 24, top + 1, 24, 22, 9);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + w - 10, top + 10, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x + w - 8.6, top + 10, 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = ink; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x + w - 14, top + 15, 4, 0.15, 1.15); ctx.stroke();
      ctx.fillStyle = body;
      round(x + 2, top + 26, 12, 6, 3);
    } else {
      ctx.beginPath();
      ctx.moveTo(x + 8, top + 8);
      ctx.quadraticCurveTo(x - 16, top + 12, x - 6, top + 20);
      ctx.lineTo(x + 10, top + 16);
      ctx.fill();
      round(x, top + 6, w - 8, h - 8, 10);
      ctx.fillStyle = belly;
      round(x + 16, top + 12, w * 0.36, 8, 4);
      ctx.fillStyle = body;
      round(x + w - 22, top + 2, 22, 16, 7);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + w - 8, top + 8, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x + w - 7, top + 8, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#e08a3c';
    const step = Math.floor(leg / 4) % 2;
    if (y > 0) {
      round(x + 12, top + h - 6, 7, 10, 3);
      round(x + 24, top + h - 3, 7, 8, 3);
    } else if (low) {
      round(x + 14, top + h - 4, 8, 6, 3);
      round(x + 34, top + h - 4, 8, 6, 3);
    } else if (step) {
      round(x + 10, top + h - 4, 8, 10, 3);
      round(x + 24, top + h - 8, 8, 8, 3);
    } else {
      round(x + 10, top + h - 8, 8, 8, 3);
      round(x + 24, top + h - 4, 8, 10, 3);
    }
  }

  function drawCactus(o) {
    ctx.fillStyle = '#2f9e44';
    round(o.x + o.w / 2 - 5, o.y, 10, o.h, 5);
    if (o.w > 16) {
      round(o.x, o.y + 10, 10, 18, 5);
      ctx.fillRect(o.x + 4, o.y + 16, 8, 6);
    }
    if (o.w > 26) {
      round(o.x + o.w - 10, o.y + 16, 10, 16, 5);
      ctx.fillRect(o.x + o.w / 2 - 2, o.y + 20, 10, 6);
    }
    ctx.strokeStyle = '#1f7a34';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(o.x + o.w / 2, o.y + 6);
    ctx.lineTo(o.x + o.w / 2, o.y + o.h - 4);
    ctx.stroke();
  }

  function drawBird(o) {
    const up = Math.floor(o.flap / 8) % 2 === 0;
    ctx.fillStyle = '#ff8c42';
    round(o.x + 6, o.y + 7, o.w - 12, 12, 6);
    ctx.fillStyle = '#ffe29a';
    round(o.x + 14, o.y + 12, o.w * 0.36, 5, 3);
    ctx.fillStyle = '#4c6fff';
    ctx.beginPath();
    ctx.moveTo(o.x + 16, o.y + 12);
    ctx.lineTo(o.x + 32, o.y + (up ? -2 : 22));
    ctx.lineTo(o.x + 36, o.y + 13);
    ctx.fill();
    ctx.fillStyle = '#f4c430';
    ctx.beginPath();
    ctx.moveTo(o.x + o.w - 8, o.y + 10);
    ctx.lineTo(o.x + o.w + 2, o.y + 13);
    ctx.lineTo(o.x + o.w - 8, o.y + 16);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(o.x + o.w - 14, o.y + 11, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    const dark = night();
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    if (dark) {
      sky.addColorStop(0, '#101a33');
      sky.addColorStop(1, '#243e68');
    } else {
      sky.addColorStop(0, '#79c6ff');
      sky.addColorStop(1, '#e7f6ff');
    }
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    if (dark) {
      ctx.fillStyle = '#f4f1c8';
      ctx.beginPath(); ctx.arc(78, 48, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#243e68';
      ctx.beginPath(); ctx.arc(86, 44, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      [[140, 30], [260, 58], [420, 24], [610, 46], [760, 22]].forEach(([sx, sy]) => {
        ctx.fillRect(sx, sy, 2, 2);
      });
    } else {
      const sun = ctx.createRadialGradient(90, 52, 4, 90, 52, 28);
      sun.addColorStop(0, '#fff4c2');
      sun.addColorStop(1, '#ffd15c');
      ctx.fillStyle = sun;
      ctx.beginPath(); ctx.arc(90, 52, 26, 0, Math.PI * 2); ctx.fill();
    }

    const scroll = (running || dead) ? score * 6 : frame * 0.4;
    ctx.fillStyle = dark ? '#1c4a38' : '#b7e39a';
    for (let i = 0; i < 5; i++) {
      const hx = ((i * 240 - scroll * 0.35) % (W + 280) + W + 280) % (W + 280) - 140;
      ctx.beginPath();
      ctx.moveTo(hx, GROUND);
      ctx.quadraticCurveTo(hx + 70, GROUND - 58, hx + 150, GROUND);
      ctx.fill();
    }
    ctx.fillStyle = dark ? '#163c2e' : '#8dce7a';
    for (let i = 0; i < 4; i++) {
      const hx = ((i * 300 - scroll * 0.55) % (W + 320) + W + 320) % (W + 320) - 160;
      ctx.beginPath();
      ctx.moveTo(hx, GROUND);
      ctx.quadraticCurveTo(hx + 80, GROUND - 36, hx + 170, GROUND);
      ctx.fill();
    }

    ctx.fillStyle = dark ? '#cbb48a' : '#e7d3a4';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 26, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 18, c.y + 3, 18, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x - 16, c.y + 4, 14, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = dark ? '#6d5433' : '#c4a06a';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = dark ? '#2f8a45' : '#3c9a45';
    ctx.fillRect(0, GROUND - 8, W, 12);
    ctx.fillStyle = dark ? '#8d6a3d' : '#b8894e';
    const offset = Math.floor(scroll) % 36;
    for (let x = -offset; x < W; x += 36) ctx.fillRect(x + 8, GROUND + 16, 8, 3);

    obstacles.forEach(o => { if (o.type === 'cactus') drawCactus(o); else drawBird(o); });
    drawDino(dinoBox());

    ctx.fillStyle = dark ? '#f4f7ff' : '#1d4a32';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(Math.floor(score)).padStart(5, '0'), W - 16, 32);
    ctx.font = '14px sans-serif';
    ctx.fillText('HI ' + String(best).padStart(5, '0'), W - 120, 32);
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px sans-serif';
    if (!running && !dead) ctx.fillText('按空格开始', W / 2, 86);
    if (dead) {
      ctx.fillText('撞到了', W / 2, 78);
      ctx.font = '16px sans-serif';
      ctx.fillText('按空格再跑一次', W / 2, 106);
    }
  }

  function frameLoop(t) {
    const dt = Math.min(2.2, (t - last) / 16.67 || 1);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frameLoop);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
    if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); setDuck(true); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowDown' || e.key === 's') setDuck(false);
  });
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const yPos = (e.clientY - rect.top) / rect.height;
    if (yPos > 0.62) setDuck(true); else jump();
  });
  canvas.addEventListener('pointerup', () => setDuck(false));
  document.getElementById('jump').onclick = jump;
  const duckBtn = document.getElementById('duck');
  duckBtn.onpointerdown = () => setDuck(true);
  duckBtn.onpointerup = duckBtn.onpointerleave = () => setDuck(false);

  reset(false);
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
