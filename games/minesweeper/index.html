<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #e6f7ff;
    padding: 72px 12px 28px;
  }
  .back-link {
    position: fixed; top: 18px; left: 18px; z-index: 10; color: #a8d8ea;
    text-decoration: none; font-size: 14px; padding: 6px 14px;
    border: 1px solid #2c5364; border-radius: 16px; background: rgba(255,255,255,0.05);
  }
  .wrap { text-align: center; }
  h1 { letter-spacing: 4px; color: #7ce7ff; margin-bottom: 12px; }
  .bar { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    border: 1px solid #2c5364; background: rgba(255,255,255,0.05); color: #e6f7ff;
    border-radius: 14px; padding: 6px 12px; cursor: pointer;
  }
  button.active, button.primary { background: #00c9a7; color: #062b26; border-color: #00c9a7; font-weight: bold; }
  .stat { color: #ffd166; font-weight: bold; min-width: 64px; }
  #board {
    display: inline-grid; background: #8fb8c9; padding: 6px; border-radius: 8px;
    user-select: none; touch-action: manipulation;
  }
  .cell {
    width: 28px; height: 28px; margin: 1px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; background: #d7eef5; color: #163244;
    cursor: pointer;
  }
  .cell.open { background: #eef7fb; cursor: default; }
  .cell.mine { background: #ff6b6b; }
  .cell.badflag { background: #ffd166; }
  .n1 { color: #1d4ed8; } .n2 { color: #15803d; } .n3 { color: #dc2626; }
  .n4 { color: #1e3a8a; } .n5 { color: #9f1239; } .n6 { color: #0f766e; }
  .n7 { color: #111827; } .n8 { color: #6b7280; }
  .hint { margin-top: 12px; color: #a8d8ea; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回游戏列表</a>
  <div class="wrap">
    <h1>扫雷</h1>
    <div class="bar">
      <button type="button" data-d="easy" class="active">初级</button>
      <button type="button" data-d="mid">中级</button>
      <button type="button" data-d="hard">高级</button>
      <button type="button" id="restart" class="primary">重开</button>
      <button type="button" id="flagMode">插旗</button>
      <span class="stat" id="left">10</span>
      <span class="stat" id="time">0</span>
      <span class="stat" id="best">最佳 --</span>
    </div>
    <div id="board"></div>
    <div class="hint">左键翻开，右键或「插旗」标记。数字表示周围地雷数。第一下不会踩雷。</div>
  </div>
<script>
(function () {
  const PRESET = {
    easy: { r: 9, c: 9, m: 10, size: 32 },
    mid: { r: 16, c: 16, m: 40, size: 26 },
    hard: { r: 16, c: 30, m: 99, size: 22 }
  };
  const boardEl = document.getElementById('board');
  let diff = 'easy', rows, cols, mineCount, mines, open, flags, started, dead, won, timer, seconds, first;

  function key(r, c) { return r + ',' + c; }
  function neighbors(r, c) {
    const list = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && cc >= 0 && rr < rows && cc < cols) list.push([rr, cc]);
    }
    return list;
  }
  function around(r, c) {
    return neighbors(r, c).reduce((n, [rr, cc]) => n + (mines.has(key(rr, cc)) ? 1 : 0), 0);
  }
  function place(sr, sc) {
    const ban = new Set(neighbors(sr, sc).map(([r, c]) => key(r, c)));
    ban.add(key(sr, sc));
    const cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (!ban.has(key(r, c))) cells.push(key(r, c));
    for (let i = cells.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cells[i], cells[j]] = [cells[j], cells[i]];
    }
    mines = new Set(cells.slice(0, mineCount));
  }
  function saveBest() {
    const k = 'gc_mine_' + diff;
    const old = Number(localStorage.getItem(k) || 0);
    if (!old || seconds < old) localStorage.setItem(k, seconds);
    showBest();
  }
  function showBest() {
    const old = Number(localStorage.getItem('gc_mine_' + diff) || 0);
    document.getElementById('best').textContent = old ? ('最佳 ' + old + 's') : '最佳 --';
  }
  function stop() { clearInterval(timer); timer = null; }
  function render() {
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', ' + PRESET[diff].size + 'px)';
    boardEl.innerHTML = '';
    let flagged = 0;
    flags.forEach(() => flagged++);
    document.getElementById('left').textContent = '雷 ' + Math.max(0, mineCount - flags.size);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.width = el.style.height = PRESET[diff].size + 'px';
      const id = key(r, c);
      const isOpen = open.has(id);
      const isMine = mines && mines.has(id);
      if (isOpen) {
        el.classList.add('open');
        if (isMine) { el.classList.add('mine'); el.textContent = '💣'; }
        else {
          const n = around(r, c);
          if (n) { el.textContent = n; el.classList.add('n' + n); }
        }
      } else if (dead && isMine) {
        el.classList.add('mine'); el.textContent = '💣';
      } else if (flags.has(id)) {
        el.textContent = '🚩';
        if (dead && !isMine) el.classList.add('badflag');
      }
      el.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c); };
      el.onclick = (e) => { if (e.shiftKey || document.getElementById('flagMode').classList.contains('active')) toggleFlag(r, c); else reveal(r, c); };
      let hold;
      el.onpointerdown = () => { hold = setTimeout(() => toggleFlag(r, c), 450); };
      el.onpointerup = el.onpointerleave = () => clearTimeout(hold);
      boardEl.appendChild(el);
    }
  }
  function startClock() {
    if (started) return;
    started = true;
    timer = setInterval(() => {
      seconds++;
      document.getElementById('time').textContent = seconds + 's';
    }, 1000);
  }
  function reveal(r, c) {
    if (dead || won || flags.has(key(r, c))) return;
    if (!mines) {
      place(r, c);
      startClock();
    }
    if (open.has(key(r, c))) { chord(r, c); return; }
    const stack = [[r, c]];
    while (stack.length) {
      const [rr, cc] = stack.pop();
      const id = key(rr, cc);
      if (open.has(id) || flags.has(id)) continue;
      open.add(id);
      if (mines.has(id)) { lose(); return; }
      if (around(rr, cc) === 0) neighbors(rr, cc).forEach(n => stack.push(n));
    }
    checkWin();
    render();
  }
  function chord(r, c) {
    if (!open.has(key(r, c)) || mines.has(key(r, c))) return;
    const n = around(r, c);
    const near = neighbors(r, c);
    const flagged = near.filter(([rr, cc]) => flags.has(key(rr, cc))).length;
    if (flagged !== n) return;
    near.forEach(([rr, cc]) => { if (!flags.has(key(rr, cc))) reveal(rr, cc); });
  }
  function toggleFlag(r, c) {
    if (dead || won || !mines || open.has(key(r, c))) return;
    const id = key(r, c);
    if (flags.has(id)) flags.delete(id); else flags.add(id);
    render();
  }
  function lose() {
    dead = true; stop(); render();
  }
  function checkWin() {
    if (open.size === rows * cols - mineCount) {
      won = true; stop(); saveBest();
      mines.forEach(id => flags.add(id));
    }
  }
  function setup(next) {
    diff = next || diff;
    const p = PRESET[diff];
    rows = p.r; cols = p.c; mineCount = p.m;
    mines = null; open = new Set(); flags = new Set();
    started = false; dead = false; won = false; seconds = 0;
    stop();
    document.getElementById('time').textContent = '0s';
    showBest();
    document.querySelectorAll('.bar button[data-d]').forEach(b => b.classList.toggle('active', b.dataset.d === diff));
    render();
  }
  document.querySelector('.bar').onclick = (e) => {
    if (e.target.dataset.d) setup(e.target.dataset.d);
  };
  document.getElementById('restart').onclick = () => setup();
  document.getElementById('flagMode').onclick = (e) => e.target.classList.toggle('active');
  setup('easy');
})();
</script>
</body>
</html>
