<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔塔</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: linear-gradient(135deg, #1a0f27, #2b1b3a, #3a1c2c);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f3e9ff;
    padding: 20px;
  }

  .game-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 22px;
    max-width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
  }

  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: #ffd166;
    text-shadow: 0 0 12px rgba(255, 209, 102, 0.5);
    margin-bottom: 12px;
    text-align: center;
  }

  .canvas-wrap { position: relative; width: min(484px, 100%); }

  canvas#tower {
    background: #120a1e;
    border: 2px solid #4a2c5e;
    border-radius: 8px;
    display: block;
    width: 100%;
    height: auto;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
  }

  .side {
    width: 240px;
    max-width: 100%;
    flex: 1 1 240px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel {
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid #4a2c5e;
    border-radius: 10px;
    padding: 12px 14px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    line-height: 2;
  }

  .stat-row .label { color: #c9a8e0; letter-spacing: 1px; }
  .stat-row .num { font-weight: bold; color: #ffd166; }
  .stat-row .num.hp { color: #ff6b8a; }
  .stat-row .num.atk { color: #ff8c5a; }
  .stat-row .num.def { color: #5ab0ff; }

  .keys-row {
    display: flex;
    justify-content: space-around;
    margin-top: 4px;
  }

  .key-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 14px;
    font-weight: bold;
  }

  .key-chip .kn { font-size: 13px; color: #d8c8e8; }

  .log {
    height: 132px;
    overflow-y: auto;
    font-size: 12.5px;
    line-height: 1.7;
    color: #d8c8e8;
  }
  .log div { margin-bottom: 2px; }
  .log .good { color: #7fe0a0; }
  .log .bad { color: #ff7a90; }
  .log .gold { color: #ffd166; }

  .controls {
    font-size: 12.5px;
    color: #c9a8e0;
    line-height: 1.9;
  }
  .controls kbd {
    background: #4a2c5e;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11.5px;
    border: 1px solid #6a4c7e;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 46px);
    gap: 4px;
    justify-content: center;
    margin-top: 6px;
  }
  .dpad button {
    border: 1px solid #6a4c7e;
    background: rgba(255, 255, 255, 0.08);
    color: #f3e9ff;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .dpad button:active { background: rgba(255, 209, 102, 0.3); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    background: rgba(12, 6, 20, 0.88);
    border-radius: 8px;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 28px; letter-spacing: 4px; color: #ffd166; }
  .overlay p { font-size: 14px; color: #d8c8e8; line-height: 1.8; }

  .main-btn {
    padding: 10px 34px;
    font-size: 16px;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    background: #ffd166;
    color: #3a1c00;
    font-weight: bold;
    letter-spacing: 2px;
    transition: transform 0.15s, background 0.15s;
  }
  .main-btn:hover { background: #ffe090; transform: scale(1.05); }
  .main-btn:active { transform: scale(0.97); }

  .shop-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 260px;
  }
  .shop-box button {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #6a4c7e;
    background: rgba(255, 209, 102, 0.15);
    color: #f3e9ff;
    font-size: 14px;
    cursor: pointer;
  }
  .shop-box button:hover:not(:disabled) { background: rgba(255, 209, 102, 0.3); }
  .shop-box button:disabled { opacity: 0.4; cursor: not-allowed; }
  .shop-box .close { background: rgba(255, 255, 255, 0.1); }

  .back-link {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    color: #d8c8e8;
    text-decoration: none;
    font-size: 14px;
    padding: 6px 14px;
    border: 1px solid #4a2c5e;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    transition: background 0.15s;
  }
  .back-link:hover { background: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回游戏列表</a>

  <div class="game-wrap">
    <div class="canvas-wrap">
      <canvas id="tower" width="484" height="484"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>魔 塔</h2>
        <p>你是闯入魔塔的勇者，需一路收集钥匙、道具与装备，<br>
           精打细算地提升攻击、防御与生命，<br>
           到达塔顶击败魔王！</p>
        <button class="main-btn" id="startBtn">进入魔塔</button>
      </div>

      <div class="overlay hidden" id="shopOverlay">
        <h2 style="font-size:22px;">🏪 魔塔商店</h2>
        <div class="shop-box">
          <button data-buy="hp">生命 +800（25 金币）</button>
          <button data-buy="atk">攻击 +5（30 金币）</button>
          <button data-buy="def">防御 +5（30 金币）</button>
          <button class="close" id="shopClose">离开商店</button>
        </div>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <h2 id="endTitle">游戏结束</h2>
        <p id="endText"></p>
        <button class="main-btn" id="restartBtn">再玩一次</button>
      </div>
    </div>

    <div class="side">
      <h1>魔 塔</h1>
      <div class="panel">
        <div class="stat-row"><span class="label">所在楼层</span><span class="num" id="floorNum">1</span></div>
        <div class="stat-row"><span class="label">❤ 生命</span><span class="num hp" id="hpNum">1000</span></div>
        <div class="stat-row"><span class="label">⚔ 攻击</span><span class="num atk" id="atkNum">10</span></div>
        <div class="stat-row"><span class="label">🛡 防御</span><span class="num def" id="defNum">10</span></div>
        <div class="stat-row"><span class="label">🪙 金币</span><span class="num" id="goldNum">0</span></div>
        <div class="stat-row"><span class="label">✨ 经验 / 等级</span><span class="num" id="expNum">0 / Lv.1</span></div>
        <div class="keys-row">
          <div class="key-chip"><canvas width="30" height="30" id="kcY"></canvas><span class="kn" id="keyY">×0</span></div>
          <div class="key-chip"><canvas width="30" height="30" id="kcE"></canvas><span class="kn" id="keyE">×0</span></div>
          <div class="key-chip"><canvas width="30" height="30" id="kcU"></canvas><span class="kn" id="keyU">×0</span></div>
        </div>
      </div>

      <div class="panel">
        <div class="log" id="log"></div>
      </div>

      <div class="panel controls">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>WASD</kbd> 移动<br>
        撞怪物战斗 · 撞门开门 · 走过道具自动拾取<br>
        撞商店交易 · 走楼梯上下楼
        <div class="dpad">
          <button class="up" data-dir="up">▲</button>
          <button class="left" data-dir="left">◀</button>
          <button class="right" data-dir="right">▶</button>
          <button class="down" data-dir="down">▼</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('tower');
  const ctx = canvas.getContext('2d');

  const hpNum = document.getElementById('hpNum');
  const atkNum = document.getElementById('atkNum');
  const defNum = document.getElementById('defNum');
  const goldNum = document.getElementById('goldNum');
  const expNum = document.getElementById('expNum');
  const floorNum = document.getElementById('floorNum');
  const keyY = document.getElementById('keyY');
  const keyE = document.getElementById('keyE');
  const keyU = document.getElementById('keyU');
  const logEl = document.getElementById('log');

  const startOverlay = document.getElementById('startOverlay');
  const shopOverlay = document.getElementById('shopOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const endTitle = document.getElementById('endTitle');
  const endText = document.getElementById('endText');

  const COLS = 11, ROWS = 11, TILE = 44;

  // ========== 地图（5 层） ==========
  const MAP_DATA = [
    [ // 第 1 层
      '###########',
      '#g..Y#..p.#',
      '#.##.#.##.#',
      '#..g......#',
      '##.####.###',
      '#@.W....g.#',
      '#.#########',
      '#..y.r.^.Y#',
      '#.##...#..#',
      '#..P...#.Y#',
      '###########'
    ],
    [ // 第 2 层
      '###########',
      '#b.y....p^#',
      '#.##.####.#',
      '#..b.#...S#',
      '##.####.###',
      '#k.....$.Y#',
      '#.##.##.###',
      '#..E.a#.1.#',
      '#.##.y###.#',
      '#v.K....d.#',
      '###########'
    ],
    [ // 第 3 层
      '###########',
      '#h..e....o#',
      '#.##.####.#',
      '#..o.#..aP#',
      '##.###.####',
      '#K...U...h#',
      '#.##.##.###',
      '#P.a..#.2.#',
      '#.##.y###.#',
      '#v..o....^Y',
      '###########'
    ],
    [ // 第 4 层
      '###########',
      '#G..u.C..G#',
      '#.##.####.#',
      '#..h.#..T#',
      '##.###.####',
      '#o...E...G#',
      '#.##.##.###',
      '#..d..#..M#',
      '#.##.y###.#',
      '#v..h....^Y',
      '###########'
    ],
    [ // 第 5 层（塔顶）
      '###########',
      '#v#Ga.dG..#',
      '#.##...##.#',
      '#....e....#',
      '#.##...##.#',
      '#....X....#',
      '#.........#',
      '#.###.###.#',
      '#..P...M..#',
      '#.........#',
      '###########'
    ]
  ];

  // ========== 怪物数据 ==========
  const MONSTERS = {
    g: { name: '绿头怪',   hp: 50,   atk: 20,  def: 1,  gold: 1,   exp: 1,   icon: '🟢' },
    r: { name: '红头怪',   hp: 70,   atk: 28,  def: 2,  gold: 2,   exp: 2,   icon: '🔴' },
    b: { name: '小蝙蝠',   hp: 110,  atk: 32,  def: 3,  gold: 3,   exp: 3,   icon: '🦇' },
    k: { name: '骷髅人',   hp: 160,  atk: 46,  def: 6,  gold: 6,   exp: 6,   icon: '💀' },
    K: { name: '骷髅士兵', hp: 280,  atk: 62,  def: 12, gold: 10,  exp: 10,  icon: '☠️' },
    o: { name: '兽人',     hp: 420,  atk: 95,  def: 22, gold: 18,  exp: 16,  icon: '🧌' },
    h: { name: '幽灵',     hp: 300,  atk: 105, def: 18, gold: 22,  exp: 22,  icon: '👻' },
    G: { name: '红衣卫兵', hp: 700,  atk: 150, def: 45, gold: 40,  exp: 35,  icon: '🗿' },
    X: { name: '魔王',     hp: 1600, atk: 210, def: 75, gold: 200, exp: 300, icon: '👹' }
  };

  // ========== 道具效果 ==========
  const ITEM_INFO = {
    p: { name: '小血瓶',   icon: '🧪', apply: p => p.hp += 200 },
    P: { name: '大血瓶',   icon: '🍷', apply: p => p.hp += 600 },
    M: { name: '圣水',     icon: '💜', apply: p => p.hp += 1500 },
    a: { name: '红宝石',   icon: '🔺', apply: p => p.atk += 4 },
    d: { name: '蓝宝石',   icon: '🔹', apply: p => p.def += 4 },
    W: { name: '铁剑',     icon: '🗡️', apply: p => p.atk += 15 },
    T: { name: '骑士长剑', icon: '⚔️', apply: p => p.atk += 35 },
    S: { name: '铁盾',     icon: '🛡️', apply: p => p.def += 15 },
    C: { name: '光辉圣盾', icon: '🛡️', apply: p => p.def += 35 },
    $: { name: '金币袋',   icon: '💰', apply: p => p.gold += 30 },
    Y: { name: '黄钥匙',   icon: '🔑', apply: p => p.keys.y++ },
    E: { name: '红钥匙',   icon: '🔑', apply: p => p.keys.e++ },
    U: { name: '蓝钥匙',   icon: '🔑', apply: p => p.keys.u++ }
  };

  const DOOR_KEY = { y: 'y', e: 'e', u: 'u' };
  const DOOR_COLOR = { y: '#e8c33a', e: '#e0485a', u: '#4a90e0' };

  // 升级所需累计经验
  const LEVEL_EXP = [0, 20, 55, 120, 220, 360, 999999];

  let floors, player, started = false, ended = false;

  function initGame() {
    floors = MAP_DATA.map(rows => rows.map(r => r.split('')));
    player = {
      hp: 1000, atk: 10, def: 10, gold: 0, exp: 0, level: 1,
      keys: { y: 0, e: 0, u: 0 },
      fi: 0, px: 0, py: 0
    };
    // 定位 @
    const f0 = floors[0];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (f0[y][x] === '@') { player.px = x; player.py = y; f0[y][x] = '.'; }
      }
    }
    ended = false;
    logEl.innerHTML = '';
    log('你推开了魔塔的大门……', 'good');
    started = true;
    updateHud();
    draw();
  }

  // ========== 日志 ==========
  function log(msg, cls) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ========== 移动 / 交互 ==========
  function move(dx, dy) {
    if (!started || ended) return;
    const tx = player.px + dx, ty = player.py + dy;
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
    const floor = floors[player.fi];
    const tile = floor[ty][tx];

    if (tile === '#') return;
    if (tile === '1' || tile === '2') { openShop(); return; }

    if (tile === 'y' || tile === 'e' || tile === 'u') {
      const k = DOOR_KEY[tile];
      if (player.keys[k] > 0) {
        player.keys[k]--;
        floor[ty][tx] = '.';
        log('使用' + ({y:'黄',e:'红',u:'蓝'})[k] + '钥匙打开了门。', 'gold');
      } else {
        log('这扇门需要' + ({y:'黄',e:'红',u:'蓝'})[k] + '钥匙，你还没有。', 'bad');
      }
      updateHud(); draw();
      return;
    }

    if (MONSTERS[tile]) {
      if (battle(tile, tx, ty)) {
        player.px = tx; player.py = ty;
      }
      updateHud(); draw();
      return;
    }

    if (ITEM_INFO[tile]) {
      const info = ITEM_INFO[tile];
      const before = snapshotAttrs();
      info.apply(player);
      floor[ty][tx] = '.';
      log(pickMessage(info, before), 'good');
      player.px = tx; player.py = ty;
      checkLevelUp();
      updateHud(); draw();
      return;
    }

    if (tile === '^' || tile === 'v') {
      player.px = tx; player.py = ty;
      changeFloor(tile);
      updateHud(); draw();
      return;
    }

    // 普通地板
    player.px = tx; player.py = ty;
    draw();
  }

  function snapshotAttrs() {
    return { hp: player.hp, atk: player.atk, def: player.def, gold: player.gold };
  }

  function pickMessage(info, before) {
    const p = player;
    switch (info.name) {
      case '小血瓶': return '拾取小血瓶，生命 +200（' + p.hp + '）';
      case '大血瓶': return '拾取大血瓶，生命 +600（' + p.hp + '）';
      case '圣水':   return '饮下圣水，生命 +1500（' + p.hp + '）';
      case '红宝石': return '镶嵌红宝石，攻击 +4（' + p.atk + '）';
      case '蓝宝石': return '镶嵌蓝宝石，防御 +4（' + p.def + '）';
      case '铁剑':   return '装备铁剑，攻击 +15（' + p.atk + '）';
      case '骑士长剑': return '装备骑士长剑，攻击 +35（' + p.atk + '）';
      case '铁盾':   return '装备铁盾，防御 +15（' + p.def + '）';
      case '光辉圣盾': return '装备光辉圣盾，防御 +35（' + p.def + '）';
      case '金币袋': return '拾得金币袋，金币 +30（' + p.gold + '）';
      case '黄钥匙':
      case '红钥匙':
      case '蓝钥匙': return '拾得' + info.name + '（持有 ' + p.keys[info.name === '黄钥匙' ? 'y' : info.name === '红钥匙' ? 'e' : 'u'] + ' 把）';
      default: return '拾取了' + info.name;
    }
  }

  // ========== 战斗 ==========
  function battle(mk, tx, ty) {
    const m = MONSTERS[mk];
    const dmgPerHit = player.atk - m.def;

    if (dmgPerHit <= 0) {
      log('【' + m.name + '】防御 ' + m.def + '，你的攻击无法破防！', 'bad');
      return false;
    }

    const hits = Math.ceil(m.hp / dmgPerHit);              // 玩家击杀所需次数
    const monsterHit = Math.max(0, m.atk - player.def);    // 怪物每击伤害
    const taken = (hits - 1) * monsterHit;                 // 玩家先手，怪物少打一次

    if (taken >= player.hp) {
      log('与【' + m.name + '】战斗将损失 ' + taken + ' 生命，必死无疑，请先提升实力！', 'bad');
      return false;
    }

    player.hp -= taken;
    player.gold += m.gold;
    player.exp += m.exp;
    floors[player.fi][ty][tx] = '.';

    let text = '击败【' + m.name + '】！损失生命 ' + taken +
               '，获得金币 ' + m.gold + '、经验 ' + m.exp;
    log(text, taken > 200 ? 'bad' : 'good');

    if (mk === 'X') {
      victory();
      return true;
    }

    checkLevelUp();

    if (player.hp <= 0) {
      gameOver();
    }
    return true;
  }

  function checkLevelUp() {
    while (player.exp >= LEVEL_EXP[player.level]) {
      player.level++;
      player.hp += 300;
      player.atk += 3;
      player.def += 3;
      log('等级提升至 Lv.' + player.level + '！生命+300、攻击+3、防御+3', 'gold');
    }
  }

  // ========== 楼层 ==========
  function changeFloor(stair) {
    if (stair === '^') {
      player.fi++;
      const f = floors[player.fi];
      const p = findTile(f, 'v');
      player.px = p.x; player.py = p.y;
      log('你登上了第 ' + (player.fi + 1) + ' 层。', 'gold');
    } else {
      player.fi--;
      const f = floors[player.fi];
      const p = findTile(f, '^');
      player.px = p.x; player.py = p.y;
      log('你回到了第 ' + (player.fi + 1) + ' 层。');
    }
  }

  function findTile(floor, ch) {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (floor[y][x] === ch) return { x, y };
      }
    }
    return { x: 1, y: 1 };
  }

  // ========== 商店 ==========
  function openShop() {
    shopOverlay.classList.remove('hidden');
    refreshShop();
  }

  function refreshShop() {
    shopOverlay.querySelectorAll('button[data-buy]').forEach(btn => {
      const kind = btn.getAttribute('data-buy');
      const price = kind === 'hp' ? 25 : 30;
      btn.disabled = player.gold < price;
    });
  }

  shopOverlay.querySelectorAll('button[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.getAttribute('data-buy');
      const price = kind === 'hp' ? 25 : 30;
      if (player.gold < price) return;
      player.gold -= price;
      if (kind === 'hp') { player.hp += 800; log('商店修炼：生命 +800', 'good'); }
      if (kind === 'atk') { player.atk += 5; log('商店修炼：攻击 +5', 'good'); }
      if (kind === 'def') { player.def += 5; log('商店修炼：防御 +5', 'good'); }
      updateHud();
      refreshShop();
      draw();
    });
  });

  document.getElementById('shopClose').addEventListener('click', () => {
    shopOverlay.classList.add('hidden');
  });

  // ========== 结局 ==========
  function victory() {
    ended = true;
    endTitle.textContent = '🎉 胜利！';
    endText.innerHTML = '魔王被你击败，魔塔重见光明！<br>最终生命 ' + player.hp +
      '，攻击 ' + player.atk + '，防御 ' + player.def +
      '<br>金币 ' + player.gold + '，等级 Lv.' + player.level;
    endOverlay.classList.remove('hidden');
  }

  function gameOver() {
    ended = true;
    endTitle.textContent = '💀 你倒下了';
    endText.textContent = '勇者倒在了第 ' + (player.fi + 1) + ' 层，魔塔仍被黑暗笼罩……';
    endOverlay.classList.remove('hidden');
  }

  // ========== HUD ==========
  function updateHud() {
    floorNum.textContent = player.fi + 1;
    hpNum.textContent = player.hp;
    atkNum.textContent = player.atk;
    defNum.textContent = player.def;
    goldNum.textContent = player.gold;
    expNum.textContent = player.exp + ' / Lv.' + player.level;
    keyY.textContent = '×' + player.keys.y;
    keyE.textContent = '×' + player.keys.e;
    keyU.textContent = '×' + player.keys.u;
    [['kcY','y'],['kcE','e'],['kcU','u']].forEach(([id,k])=>{
      const cc=document.getElementById(id); const kx=cc.getContext('2d');
      kx.clearRect(0,0,30,30);
      drawKeyOn(kx, 15, 14, 1.05, k);
    });
  }

  // ========== 渲染（Q 版手绘） ==========
  function draw() {
    if (!floors) return;
    const floor = floors[player.fi];

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = floor[y][x];
        const px = x * TILE, py = y * TILE;

        if (t === '#') {
          ctx.fillStyle = '#3e2e54';
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = '#4e3c66';
          rrectPath(px + 2.5, py + 2.5, TILE - 5, TILE - 5, 5);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.09)';
          ctx.fillRect(px + 3, py + 3, TILE - 6, 3.5);
        } else {
          ctx.fillStyle = (x + y) % 2 ? '#201632' : '#261a3c';
          ctx.fillRect(px, py, TILE, TILE);
        }

        if (t === '^' || t === 'v') drawStairs(px, py);
        else if (t === 'y' || t === 'e' || t === 'u') drawDoor(px, py, DOOR_COLOR[t]);
        else if (t === '1' || t === '2') drawEmoji('🏪', px, py, 27);
        else if (MONSTERS[t]) drawMonster(t, px, py);
        else if (ITEM_INFO[t]) drawItem(t, px, py);
      }
    }

    drawHero(player.px * TILE, player.py * TILE);
  }

  // ---------- 基础绘图小工具 ----------
  function disc(c, cx, cy, r, color) {
    c.fillStyle = color; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
  }
  function ell(c, cx, cy, rx, ry, color) {
    c.fillStyle = color; c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); c.fill();
  }
  function rrectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function rrFill(c, x, y, w, h, r, color) {
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    c.fill();
  }
  function cuteEyes(c, cx, cy, dx, wr, pr, look) {
    for (const s of [-1, 1]) {
      disc(c, cx + s * dx, cy, wr, '#ffffff');
      disc(c, cx + s * dx + (look || 0), cy + pr * 0.25, pr, '#332a44');
      disc(c, cx + s * dx + (look || 0) - pr * 0.4, cy - pr * 0.45, pr * 0.38, '#ffffff');
    }
  }
  function cuteBlush(c, cx, cy, dx) {
    for (const s of [-1, 1]) ell(c, cx + s * dx, cy, 2.3, 1.5, 'rgba(255,120,150,0.5)');
  }
  function cuteSmile(c, cx, cy, w, color) {
    c.strokeStyle = color; c.lineWidth = 1.7; c.lineCap = 'round';
    c.beginPath(); c.arc(cx, cy - w * 0.5, w, 0.18 * Math.PI, 0.82 * Math.PI); c.stroke();
  }
  function starSparkle(c, cx, cy, r, color) {
    c.fillStyle = color; c.beginPath();
    c.moveTo(cx, cy - r); c.quadraticCurveTo(cx, cy, cx + r, cy);
    c.quadraticCurveTo(cx, cy, cx, cy + r); c.quadraticCurveTo(cx, cy, cx - r, cy);
    c.quadraticCurveTo(cx, cy, cx, cy - r);
    c.fill();
  }

  function drawEmoji(emoji, px, py, size) {
    ctx.font = size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, px + TILE / 2, py + TILE / 2 + 1);
  }

  // ---------- 明亮 Q 版勇者 ----------
  function drawHero(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;

    // 小短靴
    rrFill(ctx, cx - 7, cy + 15, 6, 5.5, 2.5, '#3a5a9a');
    rrFill(ctx, cx + 1, cy + 15, 6, 5.5, 2.5, '#3a5a9a');
    // 身体（明亮蓝）
    rrFill(ctx, cx - 11, cy + 2, 22, 15, 8, '#4aa8ff');
    // 手臂
    disc(ctx, cx - 11, cy + 7, 3.3, '#ffd9b0');
    disc(ctx, cx + 11, cy + 7, 3.3, '#ffd9b0');
    // 黄色腰带 + 带扣
    ctx.fillStyle = '#ffd54a'; ctx.fillRect(cx - 11, cy + 9, 22, 3);
    ctx.fillStyle = '#e8a820'; ctx.fillRect(cx - 2, cy + 9, 4, 3);
    // 头
    disc(ctx, cx - 9.6, cy - 4, 2, '#ffd9b0');
    disc(ctx, cx + 9.6, cy - 4, 2, '#ffd9b0');
    disc(ctx, cx, cy - 5, 10, '#ffd9b0');
    // 金色头盔弧带
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath(); ctx.arc(cx, cy - 5, 10.3, Math.PI * 1.04, Math.PI * 1.96); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8a820'; ctx.fillRect(cx - 1, cy - 15, 2, 5);
    // 红色羽毛
    ctx.fillStyle = '#ff5a6a';
    ctx.beginPath();
    ctx.moveTo(cx + 2, cy - 14);
    ctx.quadraticCurveTo(cx + 11, cy - 21, cx + 8.5, cy - 12);
    ctx.quadraticCurveTo(cx + 5, cy - 13, cx + 2, cy - 12);
    ctx.fill();
    // 亮亮大眼睛
    for (const s of [-1, 1]) {
      disc(ctx, cx + s * 3.7, cy - 4, 2.4, '#ffffff');
      disc(ctx, cx + s * 3.7 + 0.6, cy - 3.5, 1.5, '#3a2a44');
      disc(ctx, cx + s * 3.7 + 0.1, cy - 4.2, 0.6, '#ffffff');
    }
    cuteBlush(ctx, cx, cy - 1, 6.6);
    cuteSmile(ctx, cx, cy - 1, 2.7, '#b06040');
  }

  // ---------- Q 版怪物 ----------
  function drawMonster(k, px, py) {
    switch (k) {
      case 'g': drawSlime(px, py, '#66dd72', '#2a8a38'); break;
      case 'r': drawSlime(px, py, '#ff7070', '#b83838'); break;
      case 'b': drawBat(px, py); break;
      case 'k': drawSkull(px, py, false); break;
      case 'K': drawSkull(px, py, true); break;
      case 'o': drawOrc(px, py); break;
      case 'h': drawGhost(px, py); break;
      case 'G': drawGuard(px, py); break;
      case 'X': drawBoss(px, py); break;
    }
  }

  function drawSlime(px, py, color, line) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy + 11);
    ctx.quadraticCurveTo(cx - 13.5, cy - 13, cx, cy - 12);
    ctx.quadraticCurveTo(cx + 13.5, cy - 13, cx + 12, cy + 11);
    ctx.quadraticCurveTo(cx, cy + 15, cx - 12, cy + 11);
    ctx.fill();
    ell(ctx, cx - 5, cy - 6, 3, 2, 'rgba(255,255,255,0.55)');
    cuteEyes(ctx, cx, cy, 4.5, 3.7, 2);
    cuteBlush(ctx, cx, cy + 4, 7);
    cuteSmile(ctx, cx, cy + 1, 2.4, line);
  }

  function drawBat(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.fillStyle = '#8a5cd8';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 5, cy - 2);
      ctx.lineTo(cx + s * 15, cy - 9);
      ctx.lineTo(cx + s * 12.5, cy - 3);
      ctx.lineTo(cx + s * 15, cy + 3);
      ctx.lineTo(cx + s * 8, cy + 2);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#a06cf0';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 4, cy - 9); ctx.lineTo(cx + s * 7.5, cy - 15); ctx.lineTo(cx + s * 8.5, cy - 8);
      ctx.fill();
    }
    disc(ctx, cx, cy, 9, '#a06cf0');
    ell(ctx, cx, cy + 3, 7, 6, '#bd92fa');
    cuteEyes(ctx, cx, cy - 2, 3.6, 2.7, 1.5);
    ctx.fillStyle = '#ffffff';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 2.2, cy + 3); ctx.lineTo(cx + s * 3.4, cy + 3); ctx.lineTo(cx + s * 2.8, cy + 5.6);
      ctx.fill();
    }
    cuteBlush(ctx, cx, cy + 2, 6);
  }

  function drawSkull(px, py, soldier) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    const white = soldier ? '#e9edf9' : '#fcfdff';
    rrFill(ctx, cx - 8, cy + 1, 16, 8.5, 4, white);
    disc(ctx, cx, cy - 3, 10.5, white);
    if (soldier) {
      ctx.fillStyle = '#4a90e0';
      ctx.beginPath(); ctx.arc(cx, cy - 3, 11, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
      ctx.fillStyle = '#ffd54a'; ctx.fillRect(cx - 1, cy - 13, 2, 4);
      disc(ctx, cx, cy - 14, 2.1, '#ff5a6a');
    }
    for (const s of [-1, 1]) {
      disc(ctx, cx + s * 4, cy - 3, 3.2, '#3a2a4c');
      disc(ctx, cx + s * 4 + 0.8, cy - 4, 1, '#ffffff');
    }
    disc(ctx, cx, cy + 1.6, 1.2, '#3a2a4c');
    ctx.strokeStyle = '#c0c6d8'; ctx.lineWidth = 1;
    for (const x of [-3, 0, 3]) {
      ctx.beginPath(); ctx.moveTo(cx + x, cy + 4.5); ctx.lineTo(cx + x, cy + 8.5); ctx.stroke();
    }
  }

  function drawOrc(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.fillStyle = '#c98a4a';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 6, cy - 10); ctx.lineTo(cx + s * 9.5, cy - 17); ctx.lineTo(cx + s * 4, cy - 13);
      ctx.fill();
    }
    ctx.fillStyle = '#9ab84a';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 9, cy - 4); ctx.lineTo(cx + 14 * s, cy - 7); ctx.lineTo(cx + 13 * s, cy - 1);
      ctx.fill();
    }
    ell(ctx, cx, cy + 6, 9, 7, '#8aa040');
    disc(ctx, cx, cy, 11, '#a8c258');
    ctx.strokeStyle = '#5a6a20'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(cx + s * 2.5, cy - 6.5); ctx.lineTo(cx + s * 6, cy - 4.8); ctx.stroke();
    }
    cuteEyes(ctx, cx, cy - 3, 3.6, 2.6, 1.4);
    ctx.fillStyle = '#ffffff';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 3, cy + 2); ctx.lineTo(cx + s * 1.4, cy + 2); ctx.lineTo(cx + s * 2.2, cy + 5.2);
      ctx.fill();
    }
    ctx.fillStyle = '#7a5a30'; ctx.fillRect(cx - 9, cy + 8, 18, 3);
    cuteBlush(ctx, cx, cy + 1, 7.6);
  }

  function drawGhost(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.fillStyle = '#f4f7ff';
    ctx.beginPath();
    ctx.arc(cx, cy - 3, 11, Math.PI, 0);
    ctx.lineTo(cx + 11, cy + 11);
    ctx.quadraticCurveTo(cx + 8, cy + 7, cx + 5.5, cy + 11);
    ctx.quadraticCurveTo(cx + 2.8, cy + 14, cx, cy + 11);
    ctx.quadraticCurveTo(cx - 2.8, cy + 14, cx - 5.5, cy + 11);
    ctx.quadraticCurveTo(cx - 8, cy + 7, cx - 11, cy + 11);
    ctx.closePath(); ctx.fill();
    cuteEyes(ctx, cx, cy - 5, 4, 3, 1.7);
    disc(ctx, cx, cy + 1, 2.2, '#8a6a9a');
    disc(ctx, cx - 0.7, cy + 0.2, 0.9, '#eccff5');
    cuteBlush(ctx, cx, cy - 1, 7);
  }

  function drawGuard(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    rrFill(ctx, cx - 11, cy + 2, 22, 15, 7, '#e8485a');
    ctx.fillStyle = '#3a2a40'; ctx.fillRect(cx - 11, cy + 10, 22, 3);
    disc(ctx, cx, cy + 11.5, 1.8, '#ffd54a');
    disc(ctx, cx - 11, cy + 8, 3, '#ffd9b0');
    disc(ctx, cx + 11, cy + 8, 3.4, '#c8d0e0');
    ctx.strokeStyle = '#7a8aa8'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx + 11, cy + 5); ctx.lineTo(cx + 11, cy + 12);
    ctx.moveTo(cx + 8, cy + 8.5); ctx.lineTo(cx + 14, cy + 8.5); ctx.stroke();
    disc(ctx, cx, cy - 5, 9.5, '#ffd9b0');
    ctx.fillStyle = '#b8c0d0';
    ctx.beginPath(); ctx.arc(cx, cy - 5, 9.8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#8a94a8'; ctx.fillRect(cx - 9.8, cy - 6, 19.6, 3);
    disc(ctx, cx, cy - 15.5, 2.4, '#ff5a6a');
    for (const s of [-1, 1]) {
      disc(ctx, cx + s * 3.4, cy - 4, 2.2, '#ffffff');
      disc(ctx, cx + s * 3.4 + 0.4, cy - 3.6, 1.4, '#3a2a44');
    }
    cuteSmile(ctx, cx, cy, 2, '#a05040');
  }

  function drawBoss(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.fillStyle = '#f0e8d8';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 8, cy - 10); ctx.lineTo(cx + s * 13.5, cy - 20); ctx.lineTo(cx + s * 5, cy - 14);
      ctx.fill();
    }
    ell(ctx, cx, cy + 8, 11, 8, '#9038b0');
    disc(ctx, cx, cy + 2, 15, '#b04ad0');
    // 小皇冠
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy - 11); ctx.lineTo(cx - 7, cy - 16); ctx.lineTo(cx - 3.5, cy - 12.5);
    ctx.lineTo(cx, cy - 17); ctx.lineTo(cx + 3.5, cy - 12.5); ctx.lineTo(cx + 7, cy - 16);
    ctx.lineTo(cx + 7, cy - 11); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5a1a70'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(cx + s * 2, cy - 7); ctx.lineTo(cx + s * 7, cy - 5); ctx.stroke();
    }
    for (const s of [-1, 1]) {
      disc(ctx, cx + s * 4.5, cy - 4, 2.6, '#ffe04a');
      disc(ctx, cx + s * 4.5, cy - 4, 1.2, '#ffffff');
    }
    ctx.fillStyle = '#ffffff';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 3.5, cy + 2); ctx.lineTo(cx + s * 1.5, cy + 2); ctx.lineTo(cx + s * 2.5, cy + 6.2);
      ctx.fill();
    }
    ell(ctx, cx - 9.5, cy + 1, 2.4, 1.6, 'rgba(255,120,150,0.4)');
    ell(ctx, cx + 9.5, cy + 1, 2.4, 1.6, 'rgba(255,120,150,0.4)');
  }

  // ---------- 三色钥匙（颜色 + 形状都不同） ----------
  function drawKeyOn(c, cx, cy, s, kind) {
    const cfg = kind === 'y' ? { main: '#ffd54a', shape: 'round' }
              : kind === 'e' ? { main: '#ff5a6a', shape: 'heart' }
              :               { main: '#5ab0ff', shape: 'diamond' };
    const bx = cx - 6 * s, by = cy - 3 * s;

    if (cfg.shape === 'round') {
      disc(c, bx, by, 5 * s, cfg.main);
      disc(c, bx, by, 2.2 * s, '#1a1028');
    }
    if (cfg.shape === 'heart') {
      c.fillStyle = cfg.main;
      c.beginPath();
      c.moveTo(bx, by + 4.2 * s);
      c.bezierCurveTo(bx - 6.2 * s, by - 1 * s, bx - 5 * s, by - 6.2 * s, bx, by - 2.6 * s);
      c.bezierCurveTo(bx + 5 * s, by - 6.2 * s, bx + 6.2 * s, by - 1 * s, bx, by + 4.2 * s);
      c.fill();
    }
    if (cfg.shape === 'diamond') {
      c.fillStyle = cfg.main;
      c.beginPath();
      c.moveTo(bx, by - 5.6 * s); c.lineTo(bx + 5 * s, by); c.lineTo(bx, by + 5.6 * s); c.lineTo(bx - 5 * s, by);
      c.closePath(); c.fill();
      c.fillStyle = '#1a1028';
      c.beginPath();
      c.moveTo(bx, by - 2.6 * s); c.lineTo(bx + 2.4 * s, by); c.lineTo(bx, by + 2.6 * s); c.lineTo(bx - 2.4 * s, by);
      c.closePath(); c.fill();
    }

    c.strokeStyle = cfg.main; c.lineWidth = 2.4 * s; c.lineCap = 'round';
    c.beginPath(); c.moveTo(bx + 3.6 * s, by + 1 * s); c.lineTo(cx + 9 * s, cy + 6 * s); c.stroke();
    c.lineWidth = 2 * s;
    c.beginPath();
    c.moveTo(cx + 7 * s, cy + 4.6 * s); c.lineTo(cx + 7 * s, cy + 7.6 * s);
    c.moveTo(cx + 9 * s, cy + 6 * s); c.lineTo(cx + 9 * s, cy + 8.6 * s);
    c.stroke();
    starSparkle(c, bx - 1.6 * s, by - 2.2 * s, 1.5 * s, 'rgba(255,255,255,0.85)');
  }

  // ---------- Q 版道具 ----------
  function drawItem(t, px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    if (t === 'p' || t === 'P' || t === 'M') drawBottle(px, py, t);
    else if (t === 'a') drawGem(px, py, '#ff5a6a');
    else if (t === 'd') drawGem(px, py, '#5aa0ff');
    else if (t === 'W') drawSword(px, py, false);
    else if (t === 'T') drawSword(px, py, true);
    else if (t === 'S') drawShield(px, py, false);
    else if (t === 'C') drawShield(px, py, true);
    else if (t === '$') drawEmoji('💰', px, py, 26);
    else if (t === 'Y') drawKeyOn(ctx, cx, cy, 1, 'y');
    else if (t === 'E') drawKeyOn(ctx, cx, cy, 1, 'e');
    else if (t === 'U') drawKeyOn(ctx, cx, cy, 1, 'u');
  }

  function drawBottle(px, py, t) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    const liquid = t === 'p' ? '#ff5a7a' : t === 'P' ? '#d82848' : '#b06cf0';
    const s = t === 'p' ? 0.85 : t === 'P' ? 1 : 1.06;
    disc(ctx, cx, cy + 3, 10.5 * s, 'rgba(222,236,255,0.92)');
    disc(ctx, cx, cy + 3, 8.6 * s, liquid);
    ell(ctx, cx - 3 * s, cy - 1 * s, 2.6 * s, 1.6 * s, 'rgba(255,255,255,0.5)');
    ctx.fillStyle = 'rgba(222,236,255,0.92)';
    ctx.fillRect(cx - 3 * s, cy - 9 * s, 6 * s, 5 * s);
    rrFill(ctx, cx - 3.7 * s, cy - 13.5 * s, 7.4 * s, 5 * s, 1.7 * s, '#b07a4a');
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(cx - 3.7 * s, cy - 11 * s, 7.4 * s, 1.4 * s);
    ell(ctx, cx - 4.6 * s, cy + 1 * s, 2 * s, 3.4 * s, 'rgba(255,255,255,0.78)');
    if (t !== 'p') disc(ctx, cx + 3 * s, cy + 6.5 * s, 1.1 * s, 'rgba(255,255,255,0.7)');
    if (t === 'M') {
      starSparkle(ctx, cx + 6.5 * s, cy - 2.5 * s, 2.5 * s, '#ffffff');
      starSparkle(ctx, cx + 8.5 * s, cy + 4.5 * s, 1.7 * s, '#ffe8a0');
    }
  }

  function drawGem(px, py, color) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 12);
    ctx.quadraticCurveTo(cx + 11, cy - 8, cx + 10, cy - 1);
    ctx.quadraticCurveTo(cx + 8, cy + 11, cx, cy + 13);
    ctx.quadraticCurveTo(cx - 8, cy + 11, cx - 10, cy - 1);
    ctx.quadraticCurveTo(cx - 11, cy - 8, cx, cy - 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy - 1); ctx.lineTo(cx + 10, cy - 1);
    ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy + 13); ctx.stroke();
    ell(ctx, cx - 4, cy - 6, 2.4, 1.6, 'rgba(255,255,255,0.6)');
    starSparkle(ctx, cx + 5.5, cy - 7.5, 2, 'rgba(255,255,255,0.95)');
  }

  function drawSword(px, py, great) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    const blade = great ? '#ffe880' : '#e9f1fc';
    ctx.fillStyle = blade;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 15); ctx.lineTo(cx + 4.6, cy - 9); ctx.lineTo(cx + 3, cy + 2);
    ctx.lineTo(cx - 3, cy + 2); ctx.lineTo(cx - 4.6, cy - 9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = great ? '#e8b040' : '#b8c8e0'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx, cy - 13); ctx.lineTo(cx, cy + 1); ctx.stroke();
    rrFill(ctx, cx - 7, cy + 1.5, 14, 3.7, 1.9, great ? '#ff9a3a' : '#8ab4e8');
    rrFill(ctx, cx - 2.2, cy + 5, 4.4, 6, 2, great ? '#a05030' : '#5a7090');
    disc(ctx, cx, cy + 11.6, 2.4, great ? '#ffd54a' : '#8ab4e8');
    starSparkle(ctx, cx + 7.5, cy - 10, great ? 2.7 : 2, '#ffffff');
  }

  function drawShield(px, py, great) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.fillStyle = great ? '#ffd54a' : '#d8e4f4';
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy - 11); ctx.lineTo(cx + 10, cy - 11);
    ctx.quadraticCurveTo(cx + 10, cy + 4, cx, cy + 14);
    ctx.quadraticCurveTo(cx - 10, cy + 4, cx - 10, cy - 11);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = great ? '#e8a020' : '#9ab0d0'; ctx.lineWidth = 2; ctx.stroke();
    if (great) {
      ctx.fillStyle = '#e8485a';
      ctx.beginPath(); ctx.moveTo(cx, cy + 3);
      ctx.bezierCurveTo(cx - 7, cy - 3, cx - 5, cy - 8, cx, cy - 3);
      ctx.bezierCurveTo(cx + 5, cy - 8, cx + 7, cy - 3, cx, cy + 3); ctx.fill();
    } else {
      ctx.fillStyle = '#5a90d8';
      rrFill(ctx, cx - 1.8, cy - 7, 3.6, 11, 1.6, '#5a90d8');
      rrFill(ctx, cx - 5.5, cy - 3.6, 11, 3.6, 1.6, '#5a90d8');
    }
    ell(ctx, cx - 4.6, cy - 6, 2, 3, 'rgba(255,255,255,0.55)');
    if (great) starSparkle(ctx, cx + 7, cy - 7, 2.2, '#ffffff');
  }

  // ---------- Q 版门 ----------
  function drawDoor(px, py, color) {
    const cx = px + TILE / 2;
    rrFill(ctx, px + 3, py + 2, TILE - 6, TILE - 4, 6, 'rgba(0,0,0,0.35)');
    rrFill(ctx, px + 5, py + 4, TILE - 10, TILE - 8, 5, color);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.4;
    for (const ox of [-3.6, 3.6]) {
      ctx.beginPath(); ctx.moveTo(cx + ox, py + 8); ctx.lineTo(cx + ox, py + TILE - 10); ctx.stroke();
    }
    disc(ctx, cx - 5, py + 9, 1.3, 'rgba(255,255,255,0.55)');
    disc(ctx, cx + 5, py + 9, 1.3, 'rgba(255,255,255,0.55)');
    disc(ctx, cx + 3.5, py + TILE / 2, 2.7, '#ffd54a');
    disc(ctx, cx + 3.5, py + TILE / 2, 1.4, '#3a2a20');
  }

  // ---------- 楼梯（纯图案，无文字） ----------
  function drawStairs(px, py) {
    const colors = ['#6c5c8c', '#7a6a9a', '#8878a8', '#9686b6'];
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = colors[i];
      ctx.fillRect(px + 6 + i * 2.4, py + 8 + i * 7.5, TILE - 12 - i * 4.8, 6.5);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(px + 6 + i * 2.4, py + 8 + i * 7.5, TILE - 12 - i * 4.8, 1.6);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(px + 6 + i * 2.4, py + 13 + i * 7.5, TILE - 12 - i * 4.8, 1.5);
    }
  }

  // ========== 输入 ==========
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    const dirs = {
      arrowup: [0, -1], w: [0, -1],
      arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0],
      arrowright: [1, 0], d: [1, 0]
    };
    if (dirs[k]) {
      e.preventDefault();
      move(dirs[k][0], dirs[k][1]);
    }
  });

  document.querySelectorAll('.dpad button').forEach(btn => {
    const handlers = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
    btn.addEventListener('click', () => {
      const d = handlers[btn.getAttribute('data-dir')];
      move(d[0], d[1]);
    });
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    startOverlay.classList.add('hidden');
    initGame();
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    endOverlay.classList.add('hidden');
    initGame();
  });

  // 初始静态画面
  floors = MAP_DATA.map(rows => rows.map(r => r.split('')));
  player = { hp: 1000, atk: 10, def: 10, gold: 0, exp: 0, level: 1,
             keys: { y: 0, e: 0, u: 0 }, fi: 0, px: 1, py: 5 };
  updateHud();
  draw();
})();
</script>
</body>
</html>
