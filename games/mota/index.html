<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔塔 · 三十层</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: linear-gradient(135deg, #1a0f27, #2b1b3a, #3a1c2c);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f3e9ff;
    padding: 20px;
  }
  .game-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 22px;
    max-width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: #ffd166;
    text-shadow: 0 0 12px rgba(255, 209, 102, 0.5);
    text-align: center;
  }
  .floor-name { text-align: center; color: #d8c8e8; font-size: 13px; letter-spacing: 1px; margin-top: 4px; }
  .canvas-wrap { position: relative; width: min(484px, 100%); }
  canvas#tower {
    background: #120a1e;
    border: 2px solid #4a2c5e;
    border-radius: 8px;
    display: block;
    width: 100%;
    height: auto;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
    touch-action: manipulation;
    cursor: pointer;
  }
  .side { width: 260px; max-width: 100%; flex: 1 1 250px; display: flex; flex-direction: column; gap: 12px; }
  .panel { background: rgba(0, 0, 0, 0.28); border: 1px solid #4a2c5e; border-radius: 10px; padding: 12px 14px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; line-height: 1.9; }
  .stat-row .label { color: #c9a8e0; }
  .stat-row .num { font-weight: bold; color: #ffd166; }
  .stat-row .num.hp { color: #ff6b8a; }
  .stat-row .num.atk { color: #ff8c5a; }
  .stat-row .num.def { color: #5ab0ff; }
  .keys-row { display: flex; justify-content: space-around; margin-top: 6px; }
  .key-chip { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: bold; }
  .key-chip .kn { color: #d8c8e8; }
  .log { height: 118px; overflow-y: auto; font-size: 12.5px; line-height: 1.7; color: #d8c8e8; }
  .log div { margin-bottom: 2px; }
  .log .good { color: #7fe0a0; }
  .log .bad { color: #ff7a90; }
  .log .gold { color: #ffd166; }
  .inspect { min-height: 62px; font-size: 12.5px; line-height: 1.65; color: #d8c8e8; }
  .inspect b { color: #ffd166; font-weight: 600; }
  .controls { font-size: 12.5px; color: #c9a8e0; line-height: 1.85; }
  .controls kbd { background: #4a2c5e; border-radius: 4px; padding: 1px 6px; font-size: 11.5px; border: 1px solid #6a4c7e; }
  .tool-row { display: flex; gap: 8px; margin-top: 8px; }
  .tool-row button, .dpad button, .shop-box button, .main-btn {
    font-family: inherit;
  }
  .tool-row button {
    flex: 1;
    border: 1px solid #6a4c7e;
    background: rgba(255, 255, 255, 0.08);
    color: #f3e9ff;
    border-radius: 8px;
    padding: 7px 0;
    cursor: pointer;
    font-size: 13px;
  }
  .tool-row button:hover { background: rgba(255, 209, 102, 0.22); }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 46px);
    gap: 4px;
    justify-content: center;
    margin-top: 8px;
  }
  .dpad button {
    border: 1px solid #6a4c7e;
    background: rgba(255, 255, 255, 0.08);
    color: #f3e9ff;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .dpad button:active { background: rgba(255, 209, 102, 0.3); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    background: rgba(12, 6, 20, 0.9);
    border-radius: 8px;
    color: #fff;
    text-align: center;
    padding: 24px;
    z-index: 2;
  }
  .hidden { display: none !important; }
  .overlay h2 { font-size: 28px; letter-spacing: 4px; color: #ffd166; }
  .overlay p { font-size: 14px; color: #d8c8e8; line-height: 1.8; }
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(8, 4, 14, 0.72);
    padding: 18px;
  }
  .sheet.hidden { display: none; }
  .card {
    width: min(440px, 100%);
    max-height: min(86vh, 680px);
    overflow: auto;
    background: #241430;
    border: 1px solid #6a4c7e;
    border-radius: 16px;
    padding: 18px 18px 16px;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
  }
  .card h2 { font-size: 20px; letter-spacing: 2px; color: #ffd166; text-align: center; margin-bottom: 8px; }
  .card .sub { text-align: center; color: #c9a8e0; font-size: 13px; margin-bottom: 12px; line-height: 1.6; }
  .shop-box { display: flex; flex-direction: column; gap: 8px; }
  .shop-box button, .ghost-btn {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #6a4c7e;
    background: rgba(255, 209, 102, 0.15);
    color: #f3e9ff;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
  }
  .shop-box button:hover:not(:disabled), .ghost-btn:hover { background: rgba(255, 209, 102, 0.3); }
  .shop-box button:disabled { opacity: 0.4; cursor: not-allowed; }
  .ghost-btn { background: rgba(255, 255, 255, 0.08); width: 100%; margin-top: 8px; }
  .book-list { display: flex; flex-direction: column; gap: 8px; }
  .book-item {
    display: grid;
    grid-template-columns: 46px 1fr;
    gap: 8px;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 10px;
    padding: 8px;
  }
  .book-item canvas { background: rgba(255,255,255,0.03); border-radius: 8px; }
  .book-item .nm { font-weight: bold; color: #ffd166; }
  .book-item .meta { font-size: 12px; color: #d8c8e8; line-height: 1.55; }
  .dmg-ok { color: #7fe0a0; }
  .dmg-mid { color: #ffd166; }
  .dmg-bad { color: #ff7a90; }
  .main-btn {
    padding: 10px 34px;
    font-size: 16px;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    background: #ffd166;
    color: #3a1c00;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .main-btn.alt { background: transparent; color: #ffd166; border: 1px solid #ffd166; }
  .back-link {
    position: fixed; top: 18px; left: 18px; z-index: 10;
    color: #d8c8e8; text-decoration: none; font-size: 14px;
    padding: 6px 14px; border: 1px solid #4a2c5e; border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
  }
  .back-link:hover { background: rgba(255, 255, 255, 0.14); }
</style>

      </div>
    </div>
    <div class="side">

        <h1>魔 塔</h1>
        <div class="floor-name" id="floorName">第 1 / 30 层 · 塔门</div>
      </div>
      <div class="panel">
        <div class="stat-row"><span class="label">❤ 生命</span><span class="num hp" id="hpNum">1000</span></div>
        <div class="stat-row"><span class="label">⚔ 攻击</span><span class="num atk" id="atkNum">10</span></div>

        <div class="keys-row">

          <div class="key-chip"><canvas width="30" height="30" id="kcZ"></canvas><span class="kn" id="keyZ">红 ×0</span></div>
        </div>
      </div>
      <div class="panel inspect" id="inspect">点地图上的格子，可以提前看怪物会打掉多少血。</div>
      <div class="panel"><div class="log" id="log"></div></div>
      <div class="panel controls">

        <div class="tool-row">
          <button type="button" id="bookBtn">图鉴</button>
          <button type="button" id="saveBtn">存档</button>
          <button type="button" id="loadBtn">读档</button>
        </div>
        <div class="dpad">

          <button type="button" class="left" data-dir="left">◀</button>
          <button type="button" class="right" data-dir="right">▶</button>
          <button type="button" class="down" data-dir="down">▼</button>
        </div>
      </div>
    </div>
  </div>

    <div class="card">

  <div class="sheet hidden" id="shopSheet">

      <div class="shop-box" id="shopBox"></div>

  <div class="sheet hidden" id="bookSheet">

      <div class="book-list" id="bookList"></div>
      <button type="button" class="ghost-btn" id="bookClose">关闭</button>
    </div>
  </div>

    x: { name: '魔剑', atk: 65 },
    s: { name: '铁盾', def: 12 },
    S: { name: '钢盾', def: 28 },
    '7': { name: '圣盾', def: 60 },
    '$': { name: '小钱袋', gold: 15 },
    '%': { name: '金币箱', gold: 45 },
    '&': { name: '宝箱', gold: 100 },
    '+': { name: '十字架', atk: 24, def: 24, hp: 900 },
    Y: { name: '黄钥匙', key: 'y' },
    Q: { name: '蓝钥匙', key: 'q' },
    Z: { name: '红钥匙', key: 'z' }
  };

  const DOOR = { y: 'y', q: 'q', z: 'z' };
  const KEY_NAME = { y: '黄', q: '蓝', z: '红' };
  const DOOR_COLOR = { y: '#e8c33a', q: '#4a90e0', z: '#e0485a' };

  const SHOPS = {
    '1': { name: '旅店', base: 20, step: 15, goods: [
      { id: 'hp', label: '生命 +250', hp: 250 },
      { id: 'atk', label: '攻击 +2', atk: 2 },
      { id: 'def', label: '防御 +2', def: 2 }
    ]},
    '2': { name: '铁匠铺', base: 45, step: 25, goods: [
      { id: 'hp', label: '生命 +600', hp: 600 },
      { id: 'atk', label: '攻击 +5', atk: 5 },
      { id: 'def', label: '防御 +5', def: 5 }
    ]},
    '3': { name: '魔塔圣堂', base: 80, step: 40, goods: [
      { id: 'hp', label: '生命 +1400', hp: 1400 },
      { id: 'atk', label: '攻击 +10', atk: 10 },
      { id: 'def', label: '防御 +10', def: 10 }
    ]}
  };

  let floors, player, started = false, ended = false;

  function freshPlayer() {
    return {
      hp: 1000, atk: 10, def: 10, gold: 0, exp: 0,
      keys: { y: 0, q: 0, z: 0 },
      fi: 0, px: 1, py: 1,
      altar: 0,
      shopBuys: { '1': 0, '2': 0, '3': 0 }
    };
  }

  function cloneMaps() {
    return MAP_SRC.map((rows) => rows.map((r) => r.split('')));
  }

  function findChar(floor, ch) {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) if (floor[y][x] === ch) return { x, y };
    }
    return null;
  }

  function dmgOf(m) {
    const hit = player.atk - m.def;
    if (hit <= 0) return Infinity;
    const hits = Math.ceil(m.hp / hit);
    const back = Math.max(0, player.def >= m.atk ? 0 : m.atk - player.def);
    return (hits - 1) * back;
  }

  function log(msg, cls) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function gain(part) {
    if (part.hp) player.hp += part.hp;
    if (part.atk) player.atk += part.atk;
    if (part.def) player.def += part.def;
    if (part.gold) player.gold += part.gold;
    if (part.key) player.keys[part.key]++;
  }

  function itemText(it) {
    const bits = [];
    if (it.hp) bits.push('生命 +' + it.hp);
    if (it.atk) bits.push('攻击 +' + it.atk);
    if (it.def) bits.push('防御 +' + it.def);
    if (it.gold) bits.push('金币 +' + it.gold);
    if (it.key) return '得到' + it.name + '，现有 ' + player.keys[it.key] + ' 把。';
    return '得到' + it.name + (bits.length ? '，' + bits.join('，') : '') + '。';
  }

  function modalOpen() {
    return ['dialogSheet', 'shopSheet', 'bookSheet'].some((id) => !document.getElementById(id).classList.contains('hidden'))
      || !endOverlay.classList.contains('hidden')
      || !startOverlay.classList.contains('hidden');
  }

  function move(dx, dy) {
    if (!started || ended || modalOpen()) return;
    const tx = player.px + dx, ty = player.py + dy;
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    const floor = floors[player.fi];
    const tile = floor[ty][tx];
    if (tile === '#') return;

    if (tile === '=') {
      floor[ty][tx] = '.';
      player.px = tx;
      player.py = ty;
      log('墙皮裂开，这面墙是假的。', 'gold');
      commit();
      return;
    }
    if (DOOR[tile]) {
      const k = DOOR[tile];
      if (player.keys[k] > 0) {
        player.keys[k]--;
        floor[ty][tx] = '.';
        log('用' + KEY_NAME[k] + '钥匙打开了门。', 'gold');
      } else {
        log('这扇门要' + KEY_NAME[k] + '钥匙。', 'bad');
      }
      commit();
      return;
    }
    if (SHOPS[tile]) { openShop(tile); return; }
    if (tile === 'N') { openNpc(); return; }
    if (MONSTERS[tile]) {
      if (battle(tile, tx, ty)) { player.px = tx; player.py = ty; }
      commit();
      return;
    }
    if (ITEMS[tile]) {
      const it = ITEMS[tile];
      gain(it);
      floor[ty][tx] = '.';
      player.px = tx;
      player.py = ty;
      log(itemText(it), 'good');
      commit();
      return;
    }
    if (tile === '^' || tile === 'v') {
      if (!changeFloor(tile)) return;
      commit();
      return;
    }
    player.px = tx;
    player.py = ty;
    draw();
    persist();
  }

  function battle(ch, tx, ty) {
    const m = MONSTERS[ch];
    const taken = dmgOf(m);
    if (taken === Infinity) {
      log('【' + m.name + '】防御 ' + m.def + '，你的攻击还破不了防。', 'bad');
      return false;
    }
    if (taken >= player.hp) {
      log('【' + m.name + '】会打掉 ' + taken + ' 点生命，你现在只有 ' + player.hp + '。先变强再来。', 'bad');
      return false;
    }
    player.hp -= taken;
    player.gold += m.gold;
    player.exp += m.exp;
    floors[player.fi][ty][tx] = '.';
    log('击败【' + m.name + '】，损失生命 ' + taken + '，金币 +' + m.gold + '，经验 +' + m.exp + '。', taken > 400 ? 'bad' : 'good');
    if (ch === 'O') victory();
    return true;
  }

  function changeFloor(stair) {
    if (stair === '^') {
      if (player.fi >= 29) return false;
      player.fi++;
      const spot = findChar(floors[player.fi], 'v');
      if (!spot) { player.fi--; return false; }
      player.px = spot.x;
      player.py = spot.y;
      log('登上第 ' + (player.fi + 1) + ' 层 · ' + NAMES[player.fi] + '。', 'gold');
    } else {
      if (player.fi <= 0) return false;
      player.fi--;
      const spot = findChar(floors[player.fi], '^');
      if (!spot) { player.fi++; return false; }
      player.px = spot.x;
      player.py = spot.y;
      log('回到第 ' + (player.fi + 1) + ' 层 · ' + NAMES[player.fi] + '。');
    }
    return true;
  }

  function commit() {
    updateHud();
    draw();
    if (!ended) persist();
  }

  function openShop(tier) {
    const shop = SHOPS[tier];
    const price = shop.base + shop.step * player.shopBuys[tier];
    document.getElementById('shopTitle').textContent = shop.name;
    document.getElementById('shopSub').textContent = '现有金币 ' + player.gold + '。这一档下次要 ' + (price + shop.step) + ' 金币，越买越贵。';
    const box = document.getElementById('shopBox');
    box.innerHTML = '';
    shop.goods.forEach((g) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = g.label + '（' + price + ' 金币）';
      btn.disabled = player.gold < price;
      btn.addEventListener('click', () => {
        const now = shop.base + shop.step * player.shopBuys[tier];
        if (player.gold < now) return;
        player.gold -= now;
        player.shopBuys[tier]++;
        gain(g);
        log(shop.name + '：' + g.label + '，花了 ' + now + ' 金币。', 'good');
        openShop(tier);
        updateHud();
        persist();
      });
      box.appendChild(btn);
    });
    document.getElementById('shopSheet').classList.remove('hidden');
  }

  function npcChoices() {
    const fi = player.fi;
    const leave = { label: '再想想', dismiss: true };
    if (fi === 1) {
      return {
        title: '智慧老人',
        text: '三十层都还在上面。选一样你现在缺的，我只能帮这一次。',
        choices: [
          { label: '攻击 +6', apply: () => { player.atk += 6; }, log: '老人点了点你的剑，攻击 +6。', remove: true },
          { label: '防御 +6', apply: () => { player.def += 6; }, log: '老人在你身上画了道符，防御 +6。', remove: true },
          { label: '生命 +400', apply: () => { player.hp += 400; }, log: '老人替你稳住了气息，生命 +400。', remove: true },
          leave
        ]
      };
    }
    if (fi === 4) {
      return {
        title: '旅人',
        text: '我这儿有两件旧货，20 金币一件。不买也行，我还坐这儿。',
        choices: [
          { label: '20 金币，攻击 +12', can: () => player.gold >= 20, apply: () => { player.gold -= 20; player.atk += 12; }, log: '买下旧剑谱，攻击 +12。', remove: true },
          { label: '20 金币，防御 +12', can: () => player.gold >= 20, apply: () => { player.gold -= 20; player.def += 12; }, log: '买下护心镜，防御 +12。', remove: true },
          leave
        ]
      };
    }
    if (fi === 7) {
      return {
        title: '小偷',
        text: '黄钥匙换蓝钥匙，怎么样？这层的门我可不动。',
        choices: [
          { label: '用 1 把黄钥匙换蓝钥匙', can: () => player.keys.y > 0, apply: () => { player.keys.y--; player.keys.q++; }, log: '小偷塞给你一把蓝钥匙，钻进墙缝不见了。', remove: true },
          leave
        ]
      };
    }
    if (fi === 11) {
      return {
        title: '仙女',
        text: '泉水还没干。喝一口，攻击、防御各 +10，生命 +600。',
        choices: [
          { label: '喝下泉水', apply: () => { player.atk += 10; player.def += 10; player.hp += 600; }, log: '泉水入喉，攻击 +10，防御 +10，生命 +600。', remove: true },
          leave
        ]
      };
    }
    if (fi === 15) {
      const left = 3 - player.altar;
      return {
        title: '经验祭坛',
        text: '还可以供奉 ' + left + ' 次。每次 30 经验，攻击 +4，防御 +4，生命 +180。',
        choices: [
          {
            label: '供奉 30 经验',
            can: () => player.altar < 3 && player.exp >= 30,
            apply: () => { player.exp -= 30; player.atk += 4; player.def += 4; player.hp += 180; player.altar++; },
            log: '祭坛亮了一下。攻击 +4，防御 +4，生命 +180。',
            remove: false
          },
          leave
        ]
      };
    }
    if (fi === 21) {
      return {
        title: '黑市商人',
        text: '上面的家伙不讲价。120 金币，攻击或防御 +28，你挑。',
        choices: [
          { label: '120 金币，攻击 +28', can: () => player.gold >= 120, apply: () => { player.gold -= 120; player.atk += 28; }, log: '黑市的符文烫进剑里，攻击 +28。', remove: true },
          { label: '120 金币，防御 +28', can: () => player.gold >= 120, apply: () => { player.gold -= 120; player.def += 28; }, log: '黑市的甲片扣上了，防御 +28。', remove: true },
          leave
        ]
      };
    }
    if (fi === 25) {
      return {
        title: '智者',
        text: '把 80 点经验交给我。攻击 +20，防御 +20，生命 +800。',
        choices: [
          { label: '交出 80 经验', can: () => player.exp >= 80, apply: () => { player.exp -= 80; player.atk += 20; player.def += 20; player.hp += 800; }, log: '智者点头。攻击 +20，防御 +20，生命 +800。', remove: true },
          leave
        ]
      };
    }
    if (fi === 28) {
      return {
        title: '公主',
        text: '魔王就在楼上。我能把剩下的力量给你：攻击 +36，防御 +24，生命 +1200。',
        choices: [
          { label: '接受祝福', apply: () => { player.atk += 36; player.def += 24; player.hp += 1200; }, log: '祝福落下来。攻击 +36，防御 +24，生命 +1200。', remove: true },
          leave
        ]
      };
    }
    return null;
  }

  function openNpc() {
    const spec = npcChoices();
    if (!spec) return;
    document.getElementById('dlgTitle').textContent = spec.title;
    document.getElementById('dlgText').textContent = spec.text;
    const box = document.getElementById('dlgChoices');
    box.innerHTML = '';
    spec.choices.forEach((c) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = c.label;
      const ok = !c.can || c.can();
      btn.disabled = !ok;
      btn.addEventListener('click', () => {
        if (c.can && !c.can()) return;
        if (c.apply) c.apply();
        if (c.log) log(c.log, 'good');
        if (c.remove) {
          const floor = floors[player.fi];
          for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (floor[y][x] === 'N') floor[y][x] = '.';
        }
        if (c.remove || c.dismiss) document.getElementById('dialogSheet').classList.add('hidden');
        else openNpc();
        commit();
      });
      box.appendChild(btn);
    });
    document.getElementById('dialogSheet').classList.remove('hidden');
  }

  function dmgLabel(taken) {
    if (taken === Infinity) return { text: '破不了防', cls: 'dmg-bad' };
    if (taken >= player.hp) return { text: '会阵亡（' + taken + '）', cls: 'dmg-bad' };
    if (taken === 0) return { text: '无伤', cls: 'dmg-ok' };
    if (taken > player.hp * 0.45) return { text: '损失 ' + taken, cls: 'dmg-bad' };
    if (taken > player.hp * 0.2) return { text: '损失 ' + taken, cls: 'dmg-mid' };
    return { text: '损失 ' + taken, cls: 'dmg-ok' };
  }

  function openBook() {
    const floor = floors[player.fi];
    const count = {};
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const ch = floor[y][x];
      if (MONSTERS[ch]) count[ch] = (count[ch] || 0) + 1;
    }
    const keys = Object.keys(count);
    const list = document.getElementById('bookList');
    list.innerHTML = '';
    if (!keys.length) {
      document.getElementById('bookSub').textContent = '这一层已经没有怪物了。';
    } else {
      let sum = 0, blocked = false;
      keys.sort((a, b) => dmgOf(MONSTERS[a]) - dmgOf(MONSTERS[b]));
      keys.forEach((ch) => {
        const m = MONSTERS[ch];
        const taken = dmgOf(m);
        const lab = dmgLabel(taken);
        if (taken === Infinity || taken >= player.hp) blocked = true;
        else sum += taken * count[ch];
        const row = document.createElement('div');
        row.className = 'book-item';
        const cv = document.createElement('canvas');
        cv.width = 46; cv.height = 46;
        const mainPen = ctx;
        ctx = cv.getContext('2d');
        try { drawMonster(ch, 1, 1); }
        finally { ctx = mainPen; }
        const meta = document.createElement('div');
        const nm = document.createElement('div');
        nm.className = 'nm';
        nm.textContent = m.name + ' ×' + count[ch];
        const info = document.createElement('div');
        info.className = 'meta';
        info.innerHTML = '生命 ' + m.hp + ' · 攻击 ' + m.atk + ' · 防御 ' + m.def
          + '<br>金币 ' + m.gold + ' · 经验 ' + m.exp + '<br><span class="' + lab.cls + '">' + lab.text + '</span>';
        meta.appendChild(nm);
        meta.appendChild(info);
        row.appendChild(cv);
        row.appendChild(meta);
        list.appendChild(row);
      });
      document.getElementById('bookSub').textContent = blocked
        ? '有怪物按现在的属性还打不过。变强之后再打开，数字会重算。'
        : '按当前属性全清，大约损失 ' + sum + ' 点生命。先捡宝石会更少。';
    }
    document.getElementById('bookSheet').classList.remove('hidden');
  }

  function describeTile(x, y) {
    if (!floors || x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
    const ch = floors[player.fi][y][x];
    if (ch === '#') inspectEl.textContent = '墙。';
    else if (ch === '=') inspectEl.textContent = '这面墙有裂缝，也许能走过去。';
    else if (ch === '.' || ch === '@') inspectEl.textContent = '空地。';
    else if (ch === '^') inspectEl.textContent = '上楼的楼梯。';
    else if (ch === 'v') inspectEl.textContent = '下楼的楼梯。';
    else if (DOOR[ch]) inspectEl.textContent = KEY_NAME[DOOR[ch]] + '门。你有 ' + player.keys[DOOR[ch]] + ' 把' + KEY_NAME[DOOR[ch]] + '钥匙。';
    else if (SHOPS[ch]) inspectEl.textContent = SHOPS[ch].name + '。撞上去可以买属性，价格会越来越贵。';
    else if (ch === 'N') inspectEl.textContent = '有人在这里。走过去就能说话。';
    else if (ITEMS[ch]) {
      const it = ITEMS[ch];
      const bits = [];
      if (it.hp) bits.push('生命 +' + it.hp);
      if (it.atk) bits.push('攻击 +' + it.atk);
      if (it.def) bits.push('防御 +' + it.def);
      if (it.gold) bits.push('金币 +' + it.gold);
      if (it.key) bits.push(KEY_NAME[it.key] + '钥匙');
      inspectEl.innerHTML = '<b>' + it.name + '</b>　' + bits.join('，');
    } else if (MONSTERS[ch]) {
      const m = MONSTERS[ch];
      const lab = dmgLabel(dmgOf(m));
      inspectEl.innerHTML = '<b>' + m.name + '</b>　生命 ' + m.hp + ' · 攻击 ' + m.atk + ' · 防御 ' + m.def
        + '<br>金币 ' + m.gold + ' · 经验 ' + m.exp + '<br><span class="' + lab.cls + '">现在去打：' + lab.text + '</span>';
    } else inspectEl.textContent = '空地。';
  }

  function victory() {
    ended = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    endTitle.textContent = '塔顶放晴';
    endText.innerHTML = '魔王倒在第三十层。<br>生命 ' + player.hp + ' · 攻击 ' + player.atk
      + ' · 防御 ' + player.def + '<br>金币 ' + player.gold + ' · 经验 ' + player.exp;
    endOverlay.classList.remove('hidden');
  }

  function updateHud() {
    floorNameEl.textContent = '第 ' + (player.fi + 1) + ' / 30 层 · ' + NAMES[player.fi];
    hpNum.textContent = player.hp;
    atkNum.textContent = player.atk;
    defNum.textContent = player.def;
    goldNum.textContent = player.gold;
    expNum.textContent = player.exp;
    document.getElementById('keyY').textContent = '黄 ×' + player.keys.y;
    document.getElementById('keyQ').textContent = '蓝 ×' + player.keys.q;
    document.getElementById('keyZ').textContent = '红 ×' + player.keys.z;
    [['kcY', 'y'], ['kcQ', 'q'], ['kcZ', 'z']].forEach(([id, k]) => {
      const c = document.getElementById(id).getContext('2d');
      c.clearRect(0, 0, 30, 30);
      drawKeyOn(c, 15, 15, 1, k);
    });
  }

  function persist() {
    if (!started || ended || !floors) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1,
        hp: player.hp, atk: player.atk, def: player.def, gold: player.gold, exp: player.exp,
        keys: player.keys, fi: player.fi, px: player.px, py: player.py,
        altar: player.altar, shopBuys: player.shopBuys,
        floors: floors.map((row) => row.join(''))
      }));
    } catch (e) {}
  }

  function readSave() {
    try {
      const data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!data || data.v !== 1 || !Array.isArray(data.floors) || data.floors.length !== 30) return null;
      if (!data.floors.every((row) => typeof row === 'string' && row.length === 11)) return null;
      return data;
    } catch (e) { return null; }
  }

  function applySave(data) {
    floors = data.floors.map((row) => row.split(''));
    player = freshPlayer();
    ['hp', 'atk', 'def', 'gold', 'exp', 'fi', 'px', 'py', 'altar'].forEach((k) => {
      if (typeof data[k] === 'number') player[k] = data[k];
    });
    if (data.keys) player.keys = { y: data.keys.y || 0, q: data.keys.q || 0, z: data.keys.z || 0 };
    if (data.shopBuys) player.shopBuys = { '1': data.shopBuys['1'] || 0, '2': data.shopBuys['2'] || 0, '3': data.shopBuys['3'] || 0 };
    ended = false;
    started = true;
    logEl.innerHTML = '';
    log('从记录里醒来，你还在第 ' + (player.fi + 1) + ' 层。', 'gold');
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    updateHud();
    draw();
  }

  function initGame() {
    floors = cloneMaps();
    player = freshPlayer();
    const at = findChar(floors[0], '@');
    player.px = at.x;
    player.py = at.y;
    floors[0][at.y][at.x] = '.';
    ended = false;
    started = true;
    logEl.innerHTML = '';
    log('你推开了塔门。上面还有二十九层。', 'gold');
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    updateHud();
    draw();
    persist();
  }

  function zone() {
    if (player.fi >= 20) return {
      a: '#2a1218', b: '#331820', wall: '#4a2430', brick: '#5c3038', hi: 'rgba(255,255,255,0.08)'
    };
    if (player.fi >= 10) return {
      a: '#142033', b: '#1a2940', wall: '#2c3e55', brick: '#3a5270', hi: 'rgba(255,255,255,0.08)'
    };
    return { a: '#201632', b: '#261a3c', wall: '#3e2e54', brick: '#4e3c66', hi: 'rgba(255,255,255,0.09)' };
  }

  function draw() {
    if (!floors || !player) return;
    const floor = floors[player.fi];
    const z = zone();
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = floor[y][x];
        const px = x * TILE, py = y * TILE;
        if (t === '#' || t === '=') {
          ctx.fillStyle = z.wall;
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = z.brick;
          rr(ctx, px + 3, py + 3, TILE - 6, TILE - 6, 5);
          ctx.fillStyle = z.hi;
          ctx.fillRect(px + 4, py + 4, TILE - 8, 3);
          if (t === '=') {
            ctx.strokeStyle = 'rgba(255,209,102,0.55)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(px + 12, py + 10);
            ctx.lineTo(px + 22, py + 24);
            ctx.moveTo(px + 26, py + 14);
            ctx.lineTo(px + 18, py + 32);
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = (x + y) % 2 ? z.a : z.b;
          ctx.fillRect(px, py, TILE, TILE);
        }
        if (t === '^' || t === 'v') drawStairs(px, py, t === '^');
        else if (DOOR[t]) drawDoor(px, py, DOOR_COLOR[t], t);
        else if (SHOPS[t]) drawShop(px, py, t);
        else if (t === 'N') drawNpc(px, py, player.fi);
        else if (MONSTERS[t]) drawMonster(t, px, py);
        else if (ITEMS[t]) drawItem(t, px, py);
      }
    }
    drawHero(player.px * TILE, player.py * TILE);
  }

  function disc(c, x, y, r, color) {
    c.fillStyle = color;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
  }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    c.fill();
  }
  function eyes(c, x, y, dx, r) {
    disc(c, x - dx, y, r, '#fff');
    disc(c, x + dx, y, r, '#fff');
    disc(c, x - dx + 0.6, y + 0.4, r * 0.48, '#2a2038');
    disc(c, x + dx + 0.6, y + 0.4, r * 0.48, '#2a2038');
  }

  function drawHero(px, py) {
    const x = px + TILE / 2, y = py + TILE / 2;
    rr(ctx, x - 7, y + 12, 6, 5, 2); ctx.fillStyle = '#3a5a9a'; rr(ctx, x - 7, y + 12, 6, 5, 2);
    ctx.fillStyle = '#3a5a9a'; rr(ctx, x + 1, y + 12, 6, 5, 2);
    ctx.fillStyle = '#4aa8ff'; rr(ctx, x - 11, y + 1, 22, 14, 7);
    disc(ctx, x - 12, y + 8, 3.2, '#ffd9b0');
    disc(ctx, x + 12, y + 8, 3.2, '#ffd9b0');
    ctx.fillStyle = '#ffd54a'; ctx.fillRect(x - 11, y + 8, 22, 3);
    disc(ctx, x, y - 6, 10, '#ffd9b0');
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath(); ctx.arc(x, y - 6, 10.2, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    ctx.fillStyle = '#ff5a6a';
    ctx.beginPath();
    ctx.moveTo(x + 2, y - 15); ctx.quadraticCurveTo(x + 12, y - 22, x + 8, y - 12); ctx.fill();
    eyes(ctx, x, y - 6, 3.6, 2.2);
  }

  function drawSlime(px, py, color, dark, big) {
    const x = px + TILE / 2, y = py + TILE / 2, s = big ? 1.18 : 1;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x - 13 * s, y + 10 * s);
    ctx.quadraticCurveTo(x - 16 * s, y - 12 * s, x, y - 14 * s);
    ctx.quadraticCurveTo(x + 16 * s, y - 12 * s, x + 13 * s, y + 10 * s);
    ctx.quadraticCurveTo(x, y + 16 * s, x - 13 * s, y + 10 * s);
    ctx.fill();
    eyes(ctx, x, y - 1, 4.2 * s, 2.4 * s);
    ctx.strokeStyle = dark; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x, y + 2, 3.2 * s, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  function drawBat(px, py, color, big) {
    const x = px + TILE / 2, y = py + TILE / 2, s = big ? 1.15 : 1;
    ctx.fillStyle = color;
    [-1, 1].forEach((d) => {
      ctx.beginPath();
      ctx.moveTo(x + d * 3, y);
      ctx.lineTo(x + d * 18 * s, y - 10 * s);
      ctx.lineTo(x + d * 12 * s, y + 2);
      ctx.lineTo(x + d * 16 * s, y + 8);
      ctx.lineTo(x + d * 4, y + 4);
      ctx.fill();
    });
    disc(ctx, x, y, 8 * s, color);
    eyes(ctx, x, y - 1, 3, 2);
    ctx.fillStyle = '#fff';
    [-1, 1].forEach((d) => {
      ctx.beginPath();
      ctx.moveTo(x + d * 1.2, y + 3); ctx.lineTo(x + d * 3.2, y + 3); ctx.lineTo(x + d * 2.2, y + 6);
      ctx.fill();
    });
  }
  function drawSkull(px, py, tier) {
    const x = px + TILE / 2, y = py + TILE / 2;
    disc(ctx, x, y - 2, 11, '#f4f7ff');
    rr(ctx, x - 8, y + 6, 16, 8, 3);
    if (tier) {
      ctx.fillStyle = tier === 2 ? '#fbbf24' : '#60a5fa';
      ctx.beginPath(); ctx.arc(x, y - 4, 11, Math.PI, 0); ctx.fill();
    }
    eyes(ctx, x, y - 2, 4, 2.5);
    ctx.fillStyle = '#2a2038';
    ctx.fillRect(x - 4, y + 8, 2, 5);
    ctx.fillRect(x - 1, y + 8, 2, 5);
    ctx.fillRect(x + 2, y + 8, 2, 5);
  }
  function drawOrc(px, py, warrior) {
    const x = px + TILE / 2, y = py + TILE / 2;
    const skin = warrior ? '#6b8f3a' : '#9ab84a';
    disc(ctx, x, y - 2, 12, skin);
    ctx.fillStyle = skin;
    ctx.fillRect(x - 10, y + 8, 20, 8);
    ctx.fillStyle = '#f4f7ff';
    [-1, 1].forEach((d) => {
      ctx.beginPath();
      ctx.moveTo(x + d * 3, y + 2); ctx.lineTo(x + d * 1, y + 2); ctx.lineTo(x + d * 2, y + 7);
      ctx.fill();
    });
    eyes(ctx, x, y - 4, 4, 2.2);
    if (warrior) {
      ctx.strokeStyle = '#d6d3d1'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + 8, y - 14); ctx.lineTo(x + 8, y + 12); ctx.stroke();
    }
  }
  function drawMage(px, py, color, big) {
    const x = px + TILE / 2, y = py + TILE / 2, s = big ? 1.08 : 1;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - 16 * s);
    ctx.lineTo(x + 12 * s, y + 14);
    ctx.lineTo(x - 12 * s, y + 14);
    ctx.fill();
    disc(ctx, x, y - 2, 7, '#ffd9b0');
    eyes(ctx, x, y - 2, 2.6, 1.6);
    disc(ctx, x, y - 16 * s, 2.4, '#ffd166');
  }
  function drawStone(px, py, big) {
    const x = px + TILE / 2, y = py + TILE / 2, s = big ? 1.12 : 1;
    ctx.fillStyle = big ? '#57534e' : '#78716c';
    rr(ctx, x - 12 * s, y - 12 * s, 24 * s, 26 * s, 6);
    eyes(ctx, x, y - 2, 4, 2.2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x - 8 * s, y - 8 * s, 6, 3);
  }
  function drawVamp(px, py) {
    const x = px + TILE / 2, y = py + TILE / 2;
    ctx.fillStyle = '#1f2937';
    ctx.beginPath();
    ctx.moveTo(x - 12, y - 4); ctx.lineTo(x - 18, y + 14); ctx.lineTo(x - 4, y + 8); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 12, y - 4); ctx.lineTo(x + 18, y + 14); ctx.lineTo(x + 4, y + 8); ctx.fill();
    disc(ctx, x, y - 2, 9, '#fecaca');
    eyes(ctx, x, y - 3, 3.2, 2);
    ctx.fillStyle = '#fff';
    [-1, 1].forEach((d) => {
      ctx.beginPath();
      ctx.moveTo(x + d * 2, y + 2); ctx.lineTo(x + d * 4, y + 2); ctx.lineTo(x + d * 3, y + 6);
      ctx.fill();
    });
  }
  function drawGhost(px, py) {
    const x = px + TILE / 2, y = py + TILE / 2;
    ctx.fillStyle = 'rgba(226,232,240,0.92)';
    ctx.beginPath();
    ctx.arc(x, y - 4, 11, Math.PI, 0);
    ctx.lineTo(x + 11, y + 12);
    ctx.quadraticCurveTo(x + 6, y + 6, x + 2, y + 12);
    ctx.quadraticCurveTo(x - 2, y + 16, x - 6, y + 10);
    ctx.quadraticCurveTo(x - 10, y + 6, x - 11, y + 12);
    ctx.fill();
    eyes(ctx, x, y - 4, 3.5, 2);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 10, y + 2); ctx.lineTo(x + 16, y - 8); ctx.stroke();
  }
  function drawKnight(px, py, color, elite) {
    const x = px + TILE / 2, y = py + TILE / 2;
    ctx.fillStyle = color;
    rr(ctx, x - 10, y - 2, 20, 16, 4);
    disc(ctx, x, y - 8, 8, '#ffd9b0');
    ctx.fillStyle = elite ? '#fbbf24' : '#cbd5e1';
    ctx.beginPath(); ctx.arc(x, y - 10, 9, Math.PI, 0); ctx.fill();
    eyes(ctx, x, y - 8, 3, 1.7);
    ctx.strokeStyle = '#e7e5e4'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 12, y - 12); ctx.lineTo(x + 12, y + 12); ctx.stroke();
  }
  function drawDragon(px, py) {
    const x = px + TILE / 2, y = py + TILE / 2;
    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.moveTo(x - 8, y + 12); ctx.quadraticCurveTo(x - 18, y - 8, x - 4, y - 12);
    ctx.quadraticCurveTo(x + 8, y - 18, x + 14, y - 6);
    ctx.quadraticCurveTo(x + 18, y + 6, x + 6, y + 12);
    ctx.fill();
    disc(ctx, x + 6, y - 4, 7, '#22c55e');
    eyes(ctx, x + 6, y - 5, 2.4, 1.6);
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.moveTo(x + 2, y - 12); ctx.lineTo(x + 6, y - 18); ctx.lineTo(x + 10, y - 12); ctx.fill();
  }
  function drawBoss(px, py, which) {
    const x = px + TILE / 2, y = py + TILE / 2;
    if (which === 'gate') {
      disc(ctx, x, y - 2, 13, '#a16207');
      ctx.fillStyle = '#a16207';
      ctx.fillRect(x - 12, y + 6, 24, 10);
      eyes(ctx, x, y - 4, 4, 2.4);
      ctx.fillStyle = '#44403c';
      ctx.fillRect(x + 8, y - 16, 4, 16);
      return;
    }
    if (which === 'lord') {
      drawKnight(px, py, '#334155', 1);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(x - 8, y - 16); ctx.lineTo(x - 4, y - 22); ctx.lineTo(x, y - 16);
      ctx.lineTo(x + 4, y - 22); ctx.lineTo(x + 8, y - 16); ctx.fill();
      return;
    }
    disc(ctx, x, y, 14, '#7e22ce');
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.moveTo(x - 10, y - 10); ctx.lineTo(x - 12, y - 20); ctx.lineTo(x - 4, y - 12);
    ctx.lineTo(x, y - 22); ctx.lineTo(x + 4, y - 12); ctx.lineTo(x + 12, y - 20); ctx.lineTo(x + 10, y - 10);
    ctx.fill();
    eyes(ctx, x, y - 2, 4, 2.3);
    ctx.fillStyle = '#fff';
    [-1, 1].forEach((d) => {
      ctx.beginPath();
      ctx.moveTo(x + d * 2, y + 4); ctx.lineTo(x + d * 5, y + 4); ctx.lineTo(x + d * 3.5, y + 8);
      ctx.fill();
    });
  }
  function drawMonster(ch, px, py) {
    const m = MONSTERS[ch];
    if (m.look === 'slime') drawSlime(px, py, m.color, m.dark, m.big);
    else if (m.look === 'bat') drawBat(px, py, m.color, m.big);
    else if (m.look === 'skull') drawSkull(px, py, m.tier || 0);
    else if (m.look === 'orc') drawOrc(px, py, m.warrior);
    else if (m.look === 'mage') drawMage(px, py, m.color, m.big);
    else if (m.look === 'stone') drawStone(px, py, m.big);
    else if (m.look === 'vamp') drawVamp(px, py);
    else if (m.look === 'ghost') drawGhost(px, py);
    else if (m.look === 'knight') drawKnight(px, py, m.color, m.elite);
    else if (m.look === 'dragon') drawDragon(px, py);
    else drawBoss(px, py, m.boss);
  }
  function drawKeyOn(c, x, y, s, kind) {
    const color = DOOR_COLOR[kind] || '#ffd54a';
    c.fillStyle = color;
    if (kind === 'q') {
      c.beginPath();
      c.moveTo(x - 6 * s, y - 2 * s); c.lineTo(x, y - 8 * s); c.lineTo(x + 6 * s, y - 2 * s); c.lineTo(x, y + 4 * s);
      c.fill();
    } else if (kind === 'z') {
      c.beginPath();
      c.moveTo(x, y + 4 * s);
      c.bezierCurveTo(x - 8 * s, y - 4 * s, x - 4 * s, y - 10 * s, x, y - 4 * s);
      c.bezierCurveTo(x + 4 * s, y - 10 * s, x + 8 * s, y - 4 * s, x, y + 4 * s);
      c.fill();
    } else {
      disc(c, x - 2 * s, y - 3 * s, 5 * s, color);
      disc(c, x - 2 * s, y - 3 * s, 2 * s, '#1a1028');
    }
    c.strokeStyle = color;
    c.lineWidth = 2.2 * s;
    c.beginPath();
    c.moveTo(x, y - 1 * s); c.lineTo(x + 8 * s, y + 7 * s); c.stroke();
  }
  function drawItem(t, px, py) {
    const x = px + TILE / 2, y = py + TILE / 2;
    if (t === 'Y' || t === 'Q' || t === 'Z') {
      drawKeyOn(ctx, x, y, 1.15, t === 'Y' ? 'y' : t === 'Q' ? 'q' : 'z');
      return;
    }
    if (t === 'p' || t === 'P' || t === '8') {
      const col = t === 'p' ? '#fb7185' : t === 'P' ? '#2563eb' : '#c084fc';
      disc(ctx, x, y + 2, 8, 'rgba(255,255,255,0.85)');
      disc(ctx, x, y + 3, 6, col);
      ctx.fillStyle = '#d6d3d1';
      ctx.fillRect(x - 2, y - 12, 4, 6);
      return;
    }
    if ('aAf'.includes(t) || 'dDi'.includes(t)) {
      const hot = 'aAf'.includes(t);
      ctx.fillStyle = t === 'f' ? '#fb923c' : t === 'i' ? '#67e8f9' : hot ? '#f43f5e' : '#60a5fa';
      ctx.beginPath();
      ctx.moveTo(x, y - 12); ctx.lineTo(x + 9, y - 2); ctx.lineTo(x, y + 12); ctx.lineTo(x - 9, y - 2);
      ctx.fill();
      if (t === 'A' || t === 'D' || t === 'f' || t === 'i') {
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.4; ctx.stroke();
      }
      return;
    }
    if (t === 'w' || t === 'W' || t === 'x') {
      ctx.strokeStyle = t === 'x' ? '#f472b6' : t === 'W' ? '#fbbf24' : '#e7e5e4';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 8); ctx.stroke();
      ctx.fillStyle = '#b45309';
      ctx.fillRect(x - 7, y + 4, 14, 3);
      return;
    }
    if (t === 's' || t === 'S' || t === '7') {
      ctx.fillStyle = t === '7' ? '#fbbf24' : t === 'S' ? '#94a3b8' : '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(x - 10, y - 10); ctx.lineTo(x + 10, y - 10); ctx.quadraticCurveTo(x + 10, y + 6, x, y + 14);
      ctx.quadraticCurveTo(x - 10, y + 6, x - 10, y - 10);
      ctx.fill();
      return;
    }
    if (t === '$' || t === '%' || t === '&') {
      disc(ctx, x, y, t === '&' ? 12 : t === '%' ? 10 : 7, '#fbbf24');
      ctx.fillStyle = '#92400e';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t === '&' ? '箱' : '金', x, y + 1);
      return;
    }
    if (t === '+') {
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(x - 3, y - 12, 6, 24);
      ctx.fillRect(x - 10, y - 3, 20, 6);
    }
  }
  function drawDoor(px, py, color, kind) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rr(ctx, px + 6, py + 3, TILE - 12, TILE - 6, 4);
    ctx.fillStyle = color;
    rr(ctx, px + 9, py + 6, TILE - 18, TILE - 12, 3);
    if (kind === 'q') drawKeyOn(ctx, px + 28, py + 24, 0.7, 'q');
    else if (kind === 'z') drawKeyOn(ctx, px + 28, py + 24, 0.7, 'z');
    else {
      disc(ctx, px + 30, py + 24, 3, '#fef3c7');
      disc(ctx, px + 30, py + 24, 1.4, '#44403c');
    }
  }
  function drawStairs(px, py, up) {
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = up ? '#fbbf24' : '#93c5fd';
      const n = up ? i : 3 - i;
      ctx.fillRect(px + 8 + n * 3, py + 8 + i * 8, TILE - 16 - n * 6, 6);
    }
  }
  function drawShop(px, py, tier) {
    const x = px + TILE / 2, y = py + TILE / 2;
    ctx.fillStyle = tier === '3' ? '#fbbf24' : tier === '2' ? '#fb923c' : '#f87171';
    ctx.beginPath();
    ctx.moveTo(x - 14, y); ctx.lineTo(x, y - 12); ctx.lineTo(x + 14, y); ctx.fill();
    ctx.fillStyle = '#fef3c7';
    rr(ctx, x - 12, y, 24, 12, 2);
  }
  function drawNpc(px, py, fi) {
    const x = px + TILE / 2, y = py + TILE / 2;
    const robe = fi === 11 ? '#f9a8d4' : fi === 28 ? '#fbcfe8' : fi === 7 ? '#44403c' : fi === 15 ? '#fb923c' : '#86efac';
    ctx.fillStyle = robe;
    rr(ctx, x - 10, y - 2, 20, 16, 6);
    disc(ctx, x, y - 8, 7, '#ffd9b0');
    eyes(ctx, x, y - 8, 2.5, 1.5);
    if (fi === 15) disc(ctx, x, y - 16, 3, '#fbbf24');
  }

  canvas.addEventListener('click', (e) => {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * COLS);
    const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
    describeTile(x, y);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      ['dialogSheet', 'shopSheet', 'bookSheet'].forEach((id) => document.getElementById(id).classList.add('hidden'));
      return;
    }
    if (modalOpen()) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { e.preventDefault(); openBook(); return; }
    const dirs = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
    if (dirs[k]) { e.preventDefault(); move(dirs[k][0], dirs[k][1]); }
  });
  document.querySelectorAll('.dpad button').forEach((btn) => {
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    btn.addEventListener('click', () => {
      const d = map[btn.getAttribute('data-dir')];
      move(d[0], d[1]);
    });
  });
  document.getElementById('bookBtn').addEventListener('click', openBook);
  document.getElementById('bookClose').addEventListener('click', () => document.getElementById('bookSheet').classList.add('hidden'));
  document.getElementById('shopClose').addEventListener('click', () => document.getElementById('shopSheet').classList.add('hidden'));
  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!started || ended) return;
    persist();
    log('进度已记在这台浏览器。', 'gold');
  });
  document.getElementById('loadBtn').addEventListener('click', () => {
    const data = readSave();
    if (!data) { log('这台浏览器里还没有存档。', 'bad'); return; }
    applySave(data);
  });
  document.getElementById('startBtn').addEventListener('click', () => {
    startOverlay.classList.add('hidden');
    initGame();
  });
  continueBtn.addEventListener('click', () => {
    const data = readSave();
    if (data) applySave(data);
  });
  document.getElementById('restartBtn').addEventListener('click', () => {
    endOverlay.classList.add('hidden');
    initGame();
  });
  window.addEventListener('beforeunload', persist);

  const saved = readSave();
  if (saved) continueBtn.classList.remove('hidden');
  floors = cloneMaps();
  player = freshPlayer();
  const preview = findChar(floors[0], '@');
  player.px = preview.x;
  player.py = preview.y;
  updateHud();
  draw();
})();
</script>
</body>
</html>
