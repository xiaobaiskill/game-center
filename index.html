<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6f7ff;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 44px;
  }

  h1 {
    font-size: 40px;
    letter-spacing: 6px;
    color: #7ce7ff;
    text-shadow: 0 0 20px rgba(124, 231, 255, 0.5);
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 16px;
    color: #a8d8ea;
    letter-spacing: 2px;
  }

  .game-list {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .game-card {
    display: block;
    width: 280px;
    padding: 36px 28px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid #2c5364;
    border-radius: 18px;
    text-decoration: none;
    color: #e6f7ff;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(4px);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
  }

  .game-card:hover {
    transform: translateY(-8px);
    border-color: #00c9a7;
    background: rgba(0, 201, 167, 0.1);
    box-shadow: 0 18px 50px rgba(0, 201, 167, 0.25);
  }

  .game-card:active { transform: translateY(-3px); }

  .game-icon {
    font-size: 64px;
    line-height: 1;
    margin-bottom: 20px;
    display: block;
  }

  .game-card h2 {
    font-size: 24px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    color: #7ce7ff;
  }

  .game-card p {
    font-size: 14px;
    color: #a8d8ea;
    line-height: 1.7;
    margin-bottom: 22px;
  }

  .play-btn {
    display: inline-block;
    padding: 9px 30px;
    border-radius: 22px;
    background: #00c9a7;
    color: #062b26;
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 2px;
    transition: background 0.15s;
  }

  .game-card:hover .play-btn { background: #2ee6c4; }

  footer {
    margin-top: 52px;
    font-size: 13px;
    color: #6e97a8;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <header>
    <h1>小游戏中心</h1>
    <div class="subtitle">选择一款游戏开始吧</div>
  </header>

  <main class="game-list">
    <a class="game-card" href="games/snake/index.html">
      <span class="game-icon">🐍</span>
      <h2>贪吃蛇</h2>
      <p>控制小蛇吃掉食物，越长越快，小心别撞到墙和自己的身体。</p>
      <span class="play-btn">开始游戏</span>
    </a>

    <a class="game-card" href="games/tetris/index.html">
      <span class="game-icon">🧱</span>
      <h2>俄罗斯方块</h2>
      <p>移动、旋转下落的方块，填满整行即可消除，等级越高挑战越大。</p>
      <span class="play-btn">开始游戏</span>
    </a>
  </main>

  <footer>共 2 款游戏 · 纯 HTML / JavaScript 实现，无需联网</footer>
</body>
</html>
