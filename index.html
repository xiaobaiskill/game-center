<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6f7ff;
  }

  .game-wrap {
    text-align: center;
    padding: 24px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
  }

  h1 {
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 12px;
    color: #7ce7ff;
    text-shadow: 0 0 12px rgba(124, 231, 255, 0.5);
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 14px;
    font-size: 16px;
  }

  .stats span { color: #ffd166; font-weight: bold; }

  canvas {
    background: #0a1622;
    border: 2px solid #2c5364;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
  }

  .controls {
    margin-top: 16px;
    font-size: 14px;
    color: #a8d8ea;
    line-height: 1.8;
  }

  .controls kbd {
    background: #2c5364;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 13px;
    border: 1px solid #4a7a8f;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    background: rgba(10, 22, 34, 0.82);
    border-radius: 8px;
    color: #fff;
  }

  .overlay.hidden { display: none; }

  .overlay h2 { font-size: 30px; letter-spacing: 3px; }

  button {
    padding: 10px 36px;
    font-size: 16px;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    background: #00c9a7;
    color: #062b26;
    font-weight: bold;
    letter-spacing: 2px;
    transition: transform 0.15s, background 0.15s;
  }

  button:hover { background: #2ee6c4; transform: scale(1.05); }
  button:active { transform: scale(0.97); }

  .canvas-wrap { position: relative; display: inline-block; }
</style>
</head>
<body>
  <div class="game-wrap">
    <h1>🐍 贪吃蛇</h1>
    <div class="stats">
      <div>得分：<span id="score">0</span></div>
      <div>最高分：<span id="best">0</span></div>
      <div>速度：<span id="level">1</span></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">贪吃蛇</h2>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="controls">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向<br>
      <kbd>空格</kbd> 暂停 / 继续
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const startBtn = document.getElementById('startBtn');

  const GRID = 24;           // 24 x 24 网格
  const CELL = canvas.width / GRID;
  const BASE_SPEED = 150;    // 初始每帧毫秒数
  const MIN_SPEED = 60;
  const SPEED_STEP = 6;      // 每吃一个食物加速的毫秒数

  let snake, dir, nextDir, food, score, best, timer, running, paused, gameOver;
  best = Number(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset() {
    const cx = Math.floor(GRID / 2);
    snake = [
      { x: cx, y: cx },
      { x: cx - 1, y: cx },
      { x: cx - 2, y: cx }
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    gameOver = false;
    paused = false;
    scoreEl.textContent = 0;
    levelEl.textContent = 1;
    spawnFood();
    draw();
  }

  function spawnFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙或撞自己
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snake_best', best);
      }
      levelEl.textContent = Math.floor(score / 5) + 1;
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    if (running && !paused && !gameOver) {
      const speed = Math.max(MIN_SPEED, BASE_SPEED - score * SPEED_STEP);
      timer = setTimeout(step, speed);
    }
  }

  function endGame() {
    gameOver = true;
    running = false;
    clearTimeout(timer);
    overlayTitle.textContent = '游戏结束 🎯';
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
    draw();
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add('hidden');
    schedule();
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    overlayTitle.textContent = paused ? '已暂停 ⏸' : '贪吃蛇';
    startBtn.textContent = paused ? '继续游戏' : '开始游戏';
    overlay.classList.toggle('hidden', !paused);
    schedule();
  }

  function draw() {
    ctx.fillStyle = '#0a1622';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 食物
    ctx.fillStyle = '#ff4757';
    ctx.shadowColor = '#ff4757';
    ctx.shadowBlur = 10;
    roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 蛇身
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0
        ? '#2ee6c4'
        : `rgb(${Math.round(46 - 30 * t)}, ${Math.round(230 - 80 * t)}, ${Math.round(196 - 60 * t)})`;
      roundRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 5);
      ctx.fill();
    });

    // 蛇眼
    const head = snake[0];
    const eyeSize = 3;
    const eyeOff = CELL * 0.22;
    const perp = { x: dir.y, y: -dir.x };
    ctx.fillStyle = '#062b26';
    [
      { x: head.x * CELL + CELL / 2 + dir.x * eyeOff + perp.x * eyeOff, y: head.y * CELL + CELL / 2 + dir.y * eyeOff + perp.y * eyeOff },
      { x: head.x * CELL + CELL / 2 + dir.x * eyeOff - perp.x * eyeOff, y: head.y * CELL + CELL / 2 + dir.y * eyeOff - perp.y * eyeOff }
    ].forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, eyeSize, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    const map = {
      arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
    };

    if (key === ' ') {
      e.preventDefault();
      togglePause();
      return;
    }

    const nd = map[key];
    if (nd) {
      e.preventDefault();
      if (!running && !gameOver) { start(); }
      // 禁止 180° 掉头
      if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
    }
  });

  startBtn.addEventListener('click', () => {
    if (paused) { togglePause(); } else { start(); }
  });

  // 触摸 / 移动端方向键
  ['up', 'down', 'left', 'right'].forEach(d => {
    document.addEventListener('keydown', () => {});
  });

  reset();
  draw();
})();
</script>
</body>
</html>
